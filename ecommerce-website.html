<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pause Papier — kits d'activités créatives sans écran." />
  <title>Pause Papier — Kits créatifs sans écran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --green: #244b3a;
      --green-dark: #19372a;
      --green-soft: #e9f0eb;
      --cream: #f7f3eb;
      --paper: #fffdf8;
      --beige: #dfcfb8;
      --sand: #b99b73;
      --text: #27312b;
      --muted: #6f776f;
      --line: #e6e0d6;
      --danger: #a33b32;
      --shadow: 0 18px 45px rgba(35, 54, 44, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: "DM Sans", sans-serif;
      line-height: 1.55;
    }
    body.no-scroll { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    img { width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, .brand-name { font-family: "Playfair Display", serif; }
    h1, h2, h3, p { margin-top: 0; }
    .container { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    .announcement {
      background: #f0ede7;
      color: #5b625c;
      font-size: .78rem;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .announcement-inner {
      min-height: 28px;
      display: flex;
      justify-content: center;
      gap: 36px;
      align-items: center;
    }
    .announcement span { display: inline-flex; align-items: center; gap: 7px; }

    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255,253,248,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      min-height: 78px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 11px; width: fit-content; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      color: var(--green); background: var(--green-soft);
      font-size: 1.25rem;
    }
    .brand-name { display: block; font-size: 1.17rem; letter-spacing: .14em; color: var(--green); line-height: 1; }
    .brand-sub { font-size: .67rem; color: var(--muted); }
    .nav-links { display: flex; align-items: center; gap: 30px; font-weight: 600; font-size: .9rem; }
    .nav-links a { position: relative; }
    .nav-links a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -7px; height: 2px; background: var(--green); transition: .25s; }
    .nav-links a:hover::after, .nav-links a:focus-visible::after { right: 0; }
    .nav-actions { justify-self: end; display: flex; gap: 10px; align-items: center; }
    .icon-btn, .lang-btn {
      border: 1px solid var(--line); background: white; border-radius: 12px;
      min-width: 42px; height: 42px; display: grid; place-items: center;
      color: var(--text); font-weight: 700;
    }
    .cart-button { position: relative; }
    .cart-count {
      position: absolute; right: -6px; top: -7px;
      min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 999px; background: var(--green); color: white;
      font-size: .7rem; display: grid; place-items: center;
    }
    .mobile-menu { display: none; }

    .hero {
      min-height: 510px;
      background:
        linear-gradient(90deg, rgba(250,247,241,.98) 0%, rgba(250,247,241,.91) 40%, rgba(250,247,241,.12) 68%),
        url('https://images.unsplash.com/photo-1510172951991-856a654063f9?auto=format&fit=crop&w=1800&q=88') center 52% / cover;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .hero-content { max-width: 590px; padding: 72px 0 50px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--green); font-size: .78rem; text-transform: uppercase;
      letter-spacing: .14em; font-weight: 700; margin-bottom: 16px;
    }
    .hero h1 { font-size: clamp(2.55rem, 5vw, 4.55rem); line-height: 1.06; color: var(--green); margin-bottom: 21px; }
    .hero p { max-width: 520px; font-size: 1.05rem; color: #505a53; margin-bottom: 26px; }
    .btn {
      border: 0; border-radius: 12px; padding: 13px 20px;
      display: inline-flex; justify-content: center; align-items: center; gap: 9px;
      font-weight: 700; transition: transform .2s, background .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--green); color: white; box-shadow: 0 10px 24px rgba(36,75,58,.22); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: white; color: var(--green); border: 1px solid var(--line); }
    .btn-ghost { background: transparent; color: var(--green); border: 1px solid var(--green); }
    .btn-block { width: 100%; }
    .hero-features {
      display: flex; flex-wrap: wrap; gap: 20px 30px;
      margin-top: 45px; color: #4f5b53; font-size: .83rem; font-weight: 600;
    }
    .hero-features span { display: inline-flex; align-items: center; gap: 8px; }
    .hero-features i { color: var(--green); font-size: 1rem; }

    .section { padding: 78px 0; }
    .intro-grid { display: grid; grid-template-columns: .95fr 1.45fr; gap: 54px; align-items: center; }
    .intro-photo {
      min-height: 380px; border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); position: relative;
    }
    .intro-photo img { height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .section-title { font-size: clamp(2rem, 3vw, 3.1rem); line-height: 1.1; color: var(--green); margin-bottom: 14px; }
    .section-lead { color: var(--muted); max-width: 760px; }
    .benefits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 32px; }
    .benefit { text-align: center; padding: 14px 8px; }
    .benefit-icon {
      width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%;
      display: grid; place-items: center; margin: 0 auto 12px; color: var(--green); font-size: 1.3rem;
    }
    .benefit strong { display: block; font-size: .88rem; margin-bottom: 5px; }
    .benefit small { color: var(--muted); line-height: 1.45; display: block; }

    .catalog { background: #fbfaf7; border-top: 1px solid var(--line); }
    .catalog-head { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
    .catalog-tools { display: flex; gap: 10px; align-items: center; }
    .search-box { position: relative; width: min(320px, 40vw); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-box input, .sort-select {
      height: 44px; border: 1px solid var(--line); background: white; border-radius: 11px; color: var(--text);
    }
    .search-box input { width: 100%; padding: 0 14px 0 41px; }
    .sort-select { padding: 0 36px 0 13px; }
    .catalog-layout { display: grid; grid-template-columns: 240px 1fr; gap: 30px; align-items: start; }
    .filters {
      position: sticky; top: 118px; background: white; border: 1px solid var(--line); border-radius: 15px; padding: 20px;
    }
    .filters-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .filters-title h3 { font-family: "DM Sans", sans-serif; font-size: 1rem; margin: 0; }
    .clear-btn { border: 0; background: transparent; color: var(--green); font-size: .78rem; font-weight: 700; }
    .filter-group { border-top: 1px solid var(--line); padding-top: 17px; margin-top: 17px; }
    .filter-group > strong { display: block; font-size: .84rem; margin-bottom: 11px; }
    .check-row { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: .84rem; color: #4e5751; }
    .check-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .check-row input { accent-color: var(--green); }
    .price-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .price-inputs input { width: 100%; border: 1px solid var(--line); border-radius: 9px; height: 40px; padding: 0 10px; }
    .results-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--muted); font-size: .86rem; }
    .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .chip { border: 1px solid #ccd9d0; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 7px 10px; font-size: .76rem; display: inline-flex; gap: 7px; align-items: center; }
    .products-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
    .product-card {
      background: white; border: 1px solid var(--line); border-radius: 15px; overflow: hidden;
      transition: transform .25s, box-shadow .25s; position: relative;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .product-image { aspect-ratio: 4/3; overflow: hidden; background: #eee7dc; position: relative; }
    .product-image img { height: 100%; object-fit: cover; transition: transform .35s; }
    .product-card:hover .product-image img { transform: scale(1.035); }
    .badge {
      position: absolute; z-index: 2; left: 12px; top: 12px; padding: 6px 9px; border-radius: 999px;
      color: white; background: var(--green); font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .time-badge { left: auto; right: 12px; background: rgba(255,255,255,.92); color: var(--green); border: 1px solid var(--line); }
    .product-body { padding: 17px; }
    .product-topline { display: flex; justify-content: space-between; gap: 12px; }
    .product-card h3 { font-family: "DM Sans", sans-serif; font-size: 1rem; margin-bottom: 4px; }
    .product-type { color: var(--muted); font-size: .78rem; margin-bottom: 13px; }
    .price { font-weight: 800; color: var(--green); white-space: nowrap; }
    .product-actions { display: grid; grid-template-columns: 1fr 44px; gap: 8px; }
    .quick-btn { border: 1px solid var(--line); background: white; border-radius: 10px; color: var(--green); }
    .empty-results { background: white; border: 1px dashed var(--line); border-radius: 16px; padding: 45px; text-align: center; grid-column: 1/-1; }

    .story-section { background: var(--green); color: white; overflow: hidden; }
    .story-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 60px; align-items: center; }
    .story-section .section-title { color: white; }
    .story-section p { color: rgba(255,255,255,.78); }
    .story-card { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); padding: 28px; border-radius: 18px; }
    .story-points { display: grid; gap: 17px; }
    .story-point { display: flex; gap: 13px; }
    .story-point i { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.13); display: grid; place-items: center; flex: 0 0 38px; }

    .journal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 28px; }
    .journal-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: white; }
    .journal-card img { aspect-ratio: 16/10; object-fit: cover; }
    .journal-body { padding: 19px; }
    .journal-body small { color: var(--sand); font-weight: 700; }
    .journal-body h3 { font-size: 1.2rem; color: var(--green); margin: 8px 0; }

    .footer { background: #17291f; color: rgba(255,255,255,.78); padding: 52px 0 26px; }
    .footer-grid { display: grid; grid-template-columns: 1.5fr repeat(3,1fr); gap: 42px; }
    .footer h3, .footer h4 { color: white; }
    .footer h4 { font-family: "DM Sans", sans-serif; font-size: .88rem; }
    .footer a { display: block; margin: 8px 0; font-size: .86rem; }
    .footer-bottom { margin-top: 35px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); display: flex; justify-content: space-between; font-size: .78rem; }


    .nav-portfolio {
      display: inline-flex !important;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      white-space: nowrap;
    }
    .nav-portfolio:hover { background: var(--soft); }

    .overlay { position: fixed; inset: 0; background: rgba(15,25,19,.50); z-index: 80; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100%); background: white; z-index: 90;
      box-shadow: -20px 0 50px rgba(0,0,0,.16); display: flex; flex-direction: column; animation: slide .28s ease;
    }
    @keyframes slide { from { transform: translateX(100%); } }
    .drawer-head, .modal-head { padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .drawer-head h2, .modal-head h2 { font-size: 1.35rem; margin: 0; color: var(--green); }
    .close-btn { border: 0; background: transparent; font-size: 1.2rem; color: var(--muted); }
    .cart-items { padding: 16px 24px; overflow: auto; flex: 1; }
    .cart-empty { text-align: center; padding: 62px 10px; color: var(--muted); }
    .cart-empty i { font-size: 3rem; display: block; margin-bottom: 14px; color: var(--green); }
    .cart-item { display: grid; grid-template-columns: 76px 1fr; gap: 13px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .cart-item img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; }
    .cart-item-top { display: flex; justify-content: space-between; gap: 10px; }
    .cart-item h4 { margin: 0; font-size: .9rem; }
    .qty { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
    .qty button { width: 30px; height: 28px; border: 0; background: #faf8f3; }
    .qty span { min-width: 30px; display: grid; place-items: center; font-size: .8rem; }
    .cart-footer { padding: 20px 24px; border-top: 1px solid var(--line); background: #fffcf7; }
    .subtotal { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 14px; }
    .secure-note { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 10px; }

    .modal-shell { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 22px; }
    .modal {
      width: min(760px, 100%); max-height: calc(100vh - 44px); overflow: auto;
      background: white; border-radius: 18px; box-shadow: 0 25px 80px rgba(0,0,0,.24); animation: pop .22s;
    }
    @keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
    .modal-body { padding: 24px; }
    .product-modal-grid { display: grid; grid-template-columns: .95fr 1.05fr; gap: 28px; }
    .product-modal-grid img { height: 100%; min-height: 360px; object-fit: cover; border-radius: 14px; }
    .meta-list { display: grid; gap: 10px; margin: 18px 0; }
    .meta-row { display: flex; gap: 10px; color: var(--muted); font-size: .88rem; }
    .meta-row i { color: var(--green); }
    .kit-details { margin: 20px 0 22px; display: grid; gap: 16px; }
    .kit-detail-box { background: #f8f6f0; border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; }
    .kit-detail-box h3 { margin: 0 0 10px; color: var(--green); font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .kit-detail-box h3 i { font-size: 1rem; }
    .kit-contents { margin: 0; padding-left: 20px; display: grid; gap: 7px; color: var(--text); font-size: .86rem; }
    .kit-result { margin: 0; color: var(--text); font-size: .86rem; line-height: 1.6; }
    .kit-note { margin: 10px 0 0; color: var(--muted); font-size: .75rem; }

    .stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-bottom: 27px; }
    .step { text-align: center; position: relative; font-size: .76rem; color: var(--muted); }
    .step::before { content: ""; position: absolute; height: 2px; top: 15px; left: -50%; width: 100%; background: var(--line); z-index: 0; }
    .step:first-child::before { display: none; }
    .step-circle { width: 31px; height: 31px; border-radius: 50%; background: var(--line); display: grid; place-items: center; margin: 0 auto 7px; position: relative; z-index: 1; font-weight: 800; }
    .step.active .step-circle, .step.done .step-circle { background: var(--green); color: white; }
    .step.done::before, .step.active::before { background: var(--green); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1/-1; }
    .field label { font-size: .78rem; font-weight: 700; }
    .field input, .field select, .field textarea {
      width: 100%; min-height: 45px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: white;
    }
    .field textarea { min-height: 105px; resize: vertical; }
    .error { color: var(--danger); font-size: .72rem; }
    .checkout-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .order-summary { background: #f7f4ed; border-radius: 13px; padding: 18px; margin-top: 18px; }
    .order-line { display: flex; justify-content: space-between; margin: 8px 0; }
    .success { text-align: center; padding: 20px 5px; }
    .success-icon { width: 74px; height: 74px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-size: 2rem; margin: 0 auto 16px; }

    .survey-trigger {
      position: fixed; right: 20px; bottom: 20px; z-index: 35;
      background: var(--green); color: white; border: 0; border-radius: 999px; padding: 12px 17px; box-shadow: var(--shadow); font-weight: 700;
    }
    .stars { display: flex; gap: 9px; font-size: 2rem; color: #d9d5cc; margin: 8px 0 18px; }
    .stars button { border: 0; background: transparent; padding: 0; color: inherit; font-size: inherit; }
    .stars button.on { color: #c79a3b; }

    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 200;
      background: #17291f; color: white; border-radius: 999px; padding: 11px 17px; box-shadow: var(--shadow); font-size: .84rem;
    }

    @media (max-width: 980px) {
      .nav { grid-template-columns: 1fr auto; }
      .nav-links { display: none; }
      .nav-actions { display: none; }
      .mobile-menu { display: grid; justify-self: end; }
      .mobile-panel { position: absolute; top: 78px; left: 0; right: 0; background: white; border-bottom: 1px solid var(--line); padding: 18px 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
      .intro-grid, .story-grid { grid-template-columns: 1fr; }
      .intro-photo { min-height: 330px; }
      .benefits { grid-template-columns: 1fr 1fr; }
      .catalog-layout { grid-template-columns: 1fr; }
      .filters { position: static; }
      .products-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .footer-grid { grid-template-columns: 1.5fr 1fr 1fr; }
      .footer-grid > div:last-child { grid-column: 1/-1; }
    }

    @media (max-width: 680px) {
      .container { width: min(100% - 24px, 1180px); }
      .announcement-inner { gap: 16px; overflow: hidden; justify-content: flex-start; white-space: nowrap; }
      .announcement span:nth-child(3) { display: none; }
      .hero { min-height: 570px; background-position: 62% center; }
      .hero-content { padding-top: 60px; }
      .hero h1 { font-size: 2.65rem; }
      .hero-features { gap: 13px 18px; }
      .section { padding: 58px 0; }
      .benefits { grid-template-columns: 1fr 1fr; }
      .catalog-head { align-items: stretch; flex-direction: column; }
      .catalog-tools { flex-direction: column; align-items: stretch; }
      .search-box { width: 100%; }
      .products-grid, .journal-grid { grid-template-columns: 1fr; }
      .product-modal-grid, .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .product-modal-grid img { min-height: 270px; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .footer-grid > div:first-child, .footer-grid > div:last-child { grid-column: 1/-1; }
      .footer-bottom { flex-direction: column; gap: 8px; }
      }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const products = [
      {
        id: 1,
        name: "Rituel du soir",
        type: "Kit d’écriture guidée",
        category: "Écriture",
        audience: "Solo",
        duration: "30 min",
        price: 34,
        level: "Débutant",
        badge: "Kit d’écriture",
        image: "assets/rituel-du-soir.png",
        description: "Un carnet guidé, des cartes d’introspection et un crayon pour ralentir avant de dormir.",
        contents: [
          "1 carnet guidé « Rituel du soir »",
          "30 cartes d’inspiration et d’introspection",
          "2 crayons en bois",
          "1 infusion biologique relaxante",
          "1 pochette en tissu réutilisable"
        ],
        outcome: "Vous terminerez la soirée avec une page écrite et un petit rituel personnel pour vous recentrer avant de dormir."
      },
      {
        id: 2,
        name: "Collage du dimanche",
        type: "Kit de collage créatif",
        category: "Collage",

          const text = `${p.name} ${p.type} ${p.category} ${p.audience}`.toLowerCase();
          const matchesQuery = text.includes(query.toLowerCase());
          const matchesCategory = !filters.category.length || filters.category.includes(p.category);
          const matchesAudience = !filters.audience.length || filters.audience.includes(p.audience);
          const matchesLevel = !filters.level.length || filters.level.includes(p.level);
          const matchesMin = filters.min === '' || p.price >= Number(filters.min);
          const matchesMax = filters.max === '' || p.price <= Number(filters.max);
          return matchesQuery && matchesCategory && matchesAudience && matchesLevel && matchesMin && matchesMax;
        });
        if (sort === 'low') result.sort((a,b) => a.price - b.price);
        if (sort === 'high') result.sort((a,b) => b.price - a.price);
        if (sort === 'name') result.sort((a,b) => a.name.localeCompare(b.name, 'fr'));
        return result;

            : [...current, { ...product, qty: 1 }];

          </div>
        </footer>

        <button className="survey-trigger" onClick={() => setSurveyOpen(true)}><i className="bi bi-chat-heart"></i> Votre avis</button>

        {cartOpen && <CartDrawer cart={cart} subtotal={subtotal} onClose={() => setCartOpen(false)} onQty={updateQty} onCheckout={() => { setCartOpen(false); setCheckoutOpen(true); }} />}
        {selectedProduct && <ProductModal product={selectedProduct} onClose={() => setSelectedProduct(null)} onAdd={(p) => { addToCart(p); setSelectedProduct(null); setCartOpen(true); }} />}
        {checkoutOpen && <CheckoutModal cart={cart} subtotal={subtotal} onClose={() => setCheckoutOpen(false)} onComplete={() => { setCart([]); setCheckoutOpen(false); setSurveyOpen(true); }} />}
        {surveyOpen && <SurveyModal onClose={() => setSurveyOpen(false)} onSubmit={() => { setSurveyOpen(false); setToast('Merci pour votre avis — il nous aide à nous améliorer.'); }} />}
        {toast && <div className="toast" role="status">{toast}</div>}
      </>;
    }

    function FilterGroup({ title, values, selected, onToggle }) {
      return <div className="filter-group"><strong>{title}</strong>{values.map(value => <div className="check-row" key={value}><label><input type="checkbox" checked={selected.includes(value)} onChange={() => onToggle(value)} />{value}</label><span>{products.filter(p => p.category === value || p.audience === value || p.level === value).length}</span></div>)}</div>;
    }

    function ProductCard({ product, onAdd, onView }) {
      return <article className="product-card">
        <div className="product-image"><span className="badge">{product.badge}</span><span className="badge time-badge">{product.duration}</span><img src={product.image} alt={`Contenu du ${product.name}`} /></div>
        <div className="product-body">
          <div className="product-topline"><div><h3>{product.name}</h3><p className="product-type">{product.type}</p></div><span className="price">{currency(product.price)}</span></div>
          <div className="product-actions"><button className="btn btn-primary" onClick={() => onAdd(product)}>Ajouter au panier</button><button className="quick-btn" onClick={() => onView(product)} aria-label={`Voir les détails de ${product.name}`}><i className="bi bi-eye"></i></button></div>
        </div>
      </article>;
    }

    function CartDrawer({ cart, subtotal, onClose, onQty, onCheckout }) {
      return <><div className="overlay" onClick={onClose}></div><aside className="drawer" aria-modal="true" role="dialog" aria-label="Votre panier">
        <div className="drawer-head"><h2>Votre panier</h2><button className="close-btn" onClick={onClose} aria-label="Fermer le panier"><i className="bi bi-x-lg"></i></button></div>
        <div className="cart-items">
          {!cart.length ? <div className="cart-empty"><i className="bi bi-bag"></i><strong>Votre panier est vide.</strong><p>Découvrez un kit qui vous ressemble.</p><button className="btn btn-secondary" onClick={onClose}>Continuer mes achats</button></div> : cart.map(item => <div className="cart-item" key={item.id}><img src={item.image} alt="" /><div><div className="cart-item-top"><div><h4>{item.name}</h4><small>{item.type}</small></div><strong>{currency(item.price * item.qty)}</strong></div><div className="qty"><button onClick={() => onQty(item.id,-1)} aria-label="Diminuer la quantité">−</button><span>{item.qty}</span><button onClick={() => onQty(item.id,1)} aria-label="Augmenter la quantité">+</button></div></div></div>)}
        </div>
        {cart.length > 0 && <div className="cart-footer"><div className="subtotal"><span>Sous-total</span><span>{currency(subtotal)}</span></div><button className="btn btn-primary btn-block" onClick={onCheckout}>Passer à la caisse</button><div className="secure-note"><i className="bi bi-lock"></i> Prototype de paiement sécurisé — aucun vrai paiement</div></div>}
      </aside></>;
    }

    function ProductModal({ product, onClose, onAdd }) {
      return <div className="modal-shell"><div className="overlay" onClick={onClose}></div><div className="modal" role="dialog" aria-modal="true" aria-label={`Détails de ${product.name}`} style={{zIndex:101}}>
        <div className="modal-head"><h2>{product.name}</h2><button className="close-btn" onClick={onClose}><i className="bi bi-x-lg"></i></button></div>
        <div className="modal-body product-modal-grid"><img src={product.image} alt={`Matériel inclus dans ${product.name}`} /><div><span className="eyebrow">{product.category}</span><h2 className="section-title" style={{fontSize:'2rem'}}>{product.name}</h2><p>{product.description}</p><div className="meta-list"><div className="meta-row"><i className="bi bi-clock"></i><span>Durée recommandée : {product.duration}</span></div><div className="meta-row"><i className="bi bi-person"></i><span>Pour : {product.audience}</span></div><div className="meta-row"><i className="bi bi-bar-chart"></i><span>Niveau : {product.level}</span></div><div className="meta-row"><i className="bi bi-box-seam"></i><span>Tout le matériel nécessaire est inclus</span></div></div><div className="kit-details"><section className="kit-detail-box"><h3><i className="bi bi-box2-heart"></i> Ce que contient le kit</h3><ul className="kit-contents">{product.contents.map((item,index)=><li key={index}>{item}</li>)}</ul><p className="kit-note">Le contenu présenté correspond au coffret complet vendu.</p></section><section className="kit-detail-box"><h3><i className="bi bi-stars"></i> Ce que vous allez créer</h3><p className="kit-result">{product.outcome}</p></section></div><h3 style={{color:'var(--green)',fontSize:'1.8rem'}}>{currency(product.price)}</h3><button className="btn btn-primary btn-block" onClick={() => onAdd(product)}>Ajouter au panier</button></div></div>
      </div></div>;
    }

    function CheckoutModal({ cart, subtotal, onClose, onComplete }) {
      const [step, setStep] = useState(1);
      const [errors, setErrors] = useState({});
      const [form, setForm] = useState({ name:'', email:'', address:'', city:'', postal:'', card:'', expiry:'', cvv:'' });
      const set = (key, value) => setForm(f => ({...f,[key]:value}));
      const validate = () => {
        const required = step === 1 ? ['name','email','address','city','postal'] : ['card','expiry','cvv'];
        const next = {};
        required.forEach(k => { if (!form[k].trim()) next[k] = 'Ce champ est requis.'; });
        if (step === 1 && form.email && !/^\S+@\S+\.\S+$/.test(form.email)) next.email = 'Entrez une adresse courriel valide.';
        if (step === 2 && form.card && form.card.replace(/\s/g,'').length < 12) next.card = 'Entrez un numéro de carte valide.';
        setErrors(next); return !Object.keys(next).length;
      };
      const next = () => { if (validate()) setStep(s => s + 1); };
      return <div className="modal-shell"><div className="overlay" onClick={onClose}></div><div className="modal" style={{zIndex:101}} role="dialog" aria-modal="true" aria-label="Finaliser la commande">
        <div className="modal-head"><h2>Finaliser la commande</h2><button className="close-btn" onClick={onClose}><i className="bi bi-x-lg"></i></button></div>
        <div className="modal-body">
          <div className="stepper">{['Livraison','Paiement','Confirmation'].map((label,i) => { const n=i+1; return <div key={label} className={`step ${step===n?'active':''} ${step>n?'done':''}`}><div className="step-circle">{step>n?<i className="bi bi-check"></i>:n}</div><span>{label}</span></div>; })}</div>
          {step === 1 && <><h3>Où devons-nous livrer votre kit&nbsp;?</h3><p className="section-lead">Étape 1 sur 3 — vos articles sont conservés dans le panier.</p><div className="form-grid"><Field label="Nom complet" value={form.name} onChange={v=>set('name',v)} error={errors.name} /><Field label="Courriel" type="email" value={form.email} onChange={v=>set('email',v)} error={errors.email} /><Field label="Adresse" value={form.address} onChange={v=>set('address',v)} error={errors.address} full /><Field label="Ville" value={form.city} onChange={v=>set('city',v)} error={errors.city} /><Field label="Code postal" value={form.postal} onChange={v=>set('postal',v)} error={errors.postal} /></div><div className="checkout-actions"><button className="btn btn-secondary" onClick={onClose}>Retour au panier</button><button className="btn btn-primary" onClick={next}>Continuer au paiement</button></div></>}
          {step === 2 && <><h3>Informations de paiement</h3><p className="section-lead">Étape 2 sur 3 — ceci est un prototype, aucune donnée n’est transmise.</p><div className="form-grid"><Field label="Numéro de carte" value={form.card} onChange={v=>set('card',v)} error={errors.card} full placeholder="4242 4242 4242 4242" /><Field label="Expiration" value={form.expiry} onChange={v=>set('expiry',v)} error={errors.expiry} placeholder="MM/AA" /><Field label="CVV" value={form.cvv} onChange={v=>set('cvv',v)} error={errors.cvv} placeholder="123" /></div><div className="order-summary"><strong>Résumé de la commande</strong>{cart.map(item=><div className="order-line" key={item.id}><span>{item.qty} × {item.name}</span><span>{currency(item.qty*item.price)}</span></div>)}<hr/><div className="order-line"><strong>Total</strong><strong>{currency(subtotal)}</strong></div></div><div className="checkout-actions"><button className="btn btn-secondary" onClick={()=>setStep(1)}>Retour</button><button className="btn btn-primary" onClick={next}>Confirmer la commande</button></div></>}
          {step === 3 && <div className="success"><div className="success-icon"><i className="bi bi-check2"></i></div><h2>Commande confirmée&nbsp;!</h2><p>Merci, {form.name || 'votre commande'} est prête. Un courriel de confirmation serait envoyé à <strong>{form.email || 'votre adresse courriel'}</strong>.</p><div className="order-summary"><div className="order-line"><span>Numéro de commande</span><strong>PP-{Math.floor(100000+Math.random()*900000)}</strong></div><div className="order-line"><span>Total</span><strong>{currency(subtotal)}</strong></div></div><button className="btn btn-primary" onClick={onComplete}>Terminer et donner mon avis</button></div>}
        </div>
      </div></div>;
    }

    function Field({ label, value, onChange, error, type='text', full=false, placeholder='' }) {
      return <div className={`field ${full?'full':''}`}><label>{label}</label><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} aria-invalid={!!error} />{error && <span className="error">{error}</span>}</div>;
    }

    function SurveyModal({ onClose, onSubmit }) {
      const [rating, setRating] = useState(0);
      const [comment, setComment] = useState('');
      const [error, setError] = useState('');
      const submit = () => { if (!rating) { setError('Choisissez une note avant d’envoyer votre avis.'); return; } onSubmit(); };
      return <div className="modal-shell"><div className="overlay" onClick={onClose}></div><div className="modal" style={{zIndex:101,maxWidth:'560px'}} role="dialog" aria-modal="true" aria-label="Sondage sur votre expérience">
        <div className="modal-head"><h2>Comment s’est passée votre visite&nbsp;?</h2><button className="close-btn" onClick={onClose}><i className="bi bi-x-lg"></i></button></div>
        <div className="modal-body"><p>Votre avis compte. Deux petites questions nous aideront à rendre chaque pause encore plus simple et agréable.</p><label><strong>Quelle note donnez-vous à votre expérience&nbsp;?</strong></label><div className="stars" aria-label="Note sur cinq">{[1,2,3,4,5].map(n=><button key={n} className={n<=rating?'on':''} onClick={()=>{setRating(n);setError('')}} aria-label={`${n} étoile${n>1?'s':''}`}><i className={`bi ${n<=rating?'bi-star-fill':'bi-star'}`}></i></button>)}</div>{error&&<p className="error">{error}</p>}<div className="field"><label>Qu’aimeriez-vous nous dire&nbsp;? <span style={{fontWeight:400}}>(facultatif)</span></label><textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Partagez une impression, une difficulté ou une idée…"></textarea></div><div className="checkout-actions"><button className="btn btn-secondary" onClick={onClose}>Plus tard</button><button className="btn btn-primary" onClick={submit}>Envoyer mon avis</button></div></div>
      </div></div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
