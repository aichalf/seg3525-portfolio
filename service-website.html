<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NutriVie, clinique fictive de nutrition à Ottawa. Comparez les services et réservez une consultation." />
  <title>NutriVie | Clinique de nutrition</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #f7f1e8;
      --cream-2: #fffaf3;
      --cream-3: #efe3d4;
      --sage: #6f8f72;
      --sage-dark: #36543a;
      --coral: #d9826b;
      --coral-dark: #9e4f3e;
      --ink: #2f241d;
      --muted: #6e5a4d;
      --line: #dfd1c2;
      --shadow: 0 18px 45px rgba(47, 36, 29, 0.12);
      --shadow-soft: 0 12px 30px rgba(47, 36, 29, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Outfit", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink);
      background: var(--cream);
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    h1, h2, h3, h4 {
      margin-top: 0;
      font-family: "Cormorant Garamond", serif;
      color: var(--ink);
    }

    h1 { font-weight: 700; letter-spacing: -0.045em; }
    h2 { font-weight: 700; letter-spacing: -0.025em; line-height: 0.98; }
    h3 { font-weight: 700; line-height: 1.12; }

    #progress {
      position: fixed;
      inset: 0 auto auto 0;
      width: 0;
      height: 3px;
      background: var(--coral);
      z-index: 10000;
      transition: width 0.08s linear;
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      padding: 0.8rem 1rem;
      color: white;
      background: var(--ink);
      z-index: 10001;
    }

    .skip-link:focus { left: 1rem; top: 1rem; }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(47, 36, 29, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(247, 241, 232, 0.18);
    }

    .nav-inner {
      max-width: 1240px;
      min-height: 76px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--cream-2);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .brand span { color: var(--coral); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.15rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-links a {
      color: #e8d8c8;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .nav-links a:hover,
    .nav-links a:focus { color: white; }

    .lang-switcher {
      display: inline-flex;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(232, 216, 200, 0.55);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
    }

    .lang-btn {
      border: 0;
      padding: 0.42rem 0.68rem;
      background: transparent;
      color: #e8d8c8;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .lang-btn.active { background: var(--coral); color: white; }
    .nav-toggle { display: none; }

    .btn-nutri,
    .btn-light-nutri,
    .btn-ghost-nutri {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: 999px;
      padding: 0.88rem 1.35rem;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .btn-nutri {
      border: 0;
      color: white;
      background: var(--coral);
      box-shadow: 0 10px 22px rgba(217, 130, 107, 0.24);
    }

    .btn-nutri:hover,
    .btn-nutri:focus {
      transform: translateY(-2px);
      color: white;
      background: var(--coral-dark);
    }

    .btn-light-nutri {
      border: 1px solid rgba(255, 255, 255, 0.7);
      color: var(--ink);
      background: var(--cream-2);
    }

    .btn-light-nutri:hover,
    .btn-light-nutri:focus {
      transform: translateY(-2px);
      color: var(--ink);
      background: white;
    }

    .btn-ghost-nutri {
      border: 1px solid var(--line);
      color: var(--sage-dark);
      background: transparent;
    }

    .btn-ghost-nutri:hover,
    .btn-ghost-nutri:focus {
      transform: translateY(-2px);
      border-color: var(--sage);
      color: var(--sage-dark);
      background: #eef5ed;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      background:
        radial-gradient(circle at 88% 22%, rgba(111, 143, 114, 0.20), transparent 32%),
        radial-gradient(circle at 12% 92%, rgba(217, 130, 107, 0.18), transparent 34%),
        linear-gradient(135deg, var(--cream-2), var(--cream));
      border-bottom: 1px solid var(--line);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.03fr 0.97fr;
      gap: 4rem;
      align-items: center;
      padding: 5.5rem 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
      color: var(--sage-dark);
      font-family: "Outfit", sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 2px;
      background: var(--coral);
    }

    .hero h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(4rem, 7.2vw, 7.4rem);
      line-height: 0.86;
    }

    .hero h1 em { color: var(--sage-dark); font-style: italic; }

    .hero-lead {
      max-width: 650px;
      margin: 1.6rem 0 0;
      color: var(--muted);
      font-size: clamp(1.08rem, 1.5vw, 1.22rem);
      line-height: 1.7;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.85rem; margin-top: 2rem; }
    .trust-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2rem; }

    .trust-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.58rem 0.88rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--sage-dark);
      background: rgba(255, 250, 243, 0.82);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .hero-visual { position: relative; min-height: 560px; }

    .hero-image {
      width: 100%;
      height: 560px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .availability-card {
      position: absolute;
      left: -42px;
      bottom: 34px;
      width: min(390px, calc(100% - 30px));
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      color: white;
      background: rgba(47, 36, 29, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .availability-card h3 {
      margin-bottom: 0.65rem;
      color: white;
      font-size: 2rem;
    }

    .preview-line {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      color: #eadbd0;
    }

    .preview-line:last-child { border-bottom: 0; }

    .section { padding: 6rem 0; border-bottom: 1px solid var(--line); }
    .section.alt { background: var(--cream-2); }

    .section-title { max-width: 790px; margin-bottom: 3rem; }

    .section-title h2 {
      margin-bottom: 1rem;
      font-size: clamp(3.1rem, 5.4vw, 5rem);
    }

    .section-title p {
      max-width: 700px;
      margin: 0;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.7;
    }

    .service-card,
    .why-card,
    .faq-card,
    .booking-card,
    .process-panel {
      border: 1px solid var(--line);
      border-radius: 26px;
      background: white;
      box-shadow: var(--shadow-soft);
    }

    .service-card {
      height: 100%;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: rgba(111, 143, 114, 0.6);
      box-shadow: var(--shadow);
    }

    .service-image-wrap { position: relative; overflow: hidden; aspect-ratio: 4 / 3; }
    .service-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .service-card:hover .service-image { transform: scale(1.035); }

    .service-price-badge {
      position: absolute;
      right: 1rem;
      top: 1rem;
      padding: 0.45rem 0.72rem;
      border-radius: 999px;
      color: white;
      background: rgba(47, 36, 29, 0.88);
      font-size: 0.85rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .service-content { padding: 1.4rem; }

    .service-card h3 {
      min-height: 2.3em;
      margin: 0;
      font-size: 2rem;
    }

    .service-meta { display: flex; flex-wrap: wrap; gap: 0.55rem; margin: 0.9rem 0 1rem; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.38rem 0.68rem;
      border-radius: 999px;
      color: var(--sage-dark);
      background: #f1e7d9;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .service-card p { min-height: 5.1em; margin-bottom: 1.15rem; color: var(--muted); }
    .service-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .service-actions .btn-nutri,
    .service-actions .btn-ghost-nutri { padding-inline: 0.8rem; font-size: 0.92rem; }

    .process-grid {
      display: grid;
      grid-template-columns: 1fr 0.95fr;
      gap: 3rem;
      align-items: stretch;
    }

    .process-panel { padding: 2rem; }
    .process-step { display: grid; grid-template-columns: 64px 1fr; gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
    .process-step:last-child { border-bottom: 0; }

    .step-number {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--sage-dark);
      background: #e5efe4;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .process-step h3 { margin: 0 0 0.2rem; font-size: 1.75rem; }
    .process-step p { margin: 0; color: var(--muted); }

    .process-image {
      width: 100%;
      height: 100%;
      min-height: 560px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
    }

    .why-card { height: 100%; padding: 1.5rem; }

    .icon-circle {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--sage);
      font-size: 1.25rem;
    }

    .why-card h3 { margin: 1rem 0 0.45rem; font-size: 1.85rem; }
    .why-card p { margin: 0; color: var(--muted); }

    .visual-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1rem; }

    .visual-tile {
      position: relative;
      overflow: hidden;
      min-height: 380px;
      border-radius: 26px;
      box-shadow: var(--shadow-soft);
    }

    .visual-tile img { width: 100%; height: 100%; object-fit: cover; }

    .visual-tile::after {
      content: "";
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(transparent, rgba(47, 36, 29, 0.86));
    }

    .visual-caption {
      position: absolute;
      z-index: 1;
      left: 1.25rem;
      right: 1.25rem;
      bottom: 1.2rem;
      color: white;
    }

    .visual-caption h3 { margin: 0 0 0.25rem; color: white; font-size: 2rem; }
    .visual-caption p { margin: 0; color: rgba(255, 255, 255, 0.86); }

    .booking-card { padding: 1.6rem; }

    .summary-panel {
      height: 100%;
      padding: 1.6rem;
      border-radius: 26px;
      color: white;
      background: var(--sage-dark);
      box-shadow: var(--shadow-soft);
    }

    .summary-panel h3 { margin-bottom: 0.4rem; color: white; font-size: 2.2rem; }
    .summary-panel p { color: #d9e8da; }

    .summary-item {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 0.75rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .summary-item span:first-child { color: #cfe0d0; font-weight: 700; }
    .form-label { color: var(--ink); font-weight: 800; }

    .form-control,
    .form-select {
      padding: 0.85rem 0.95rem;
      border-color: var(--line);
      border-radius: 14px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 0.2rem rgba(111, 143, 114, 0.15);
    }

    .confirmation {
      padding: 1.2rem;
      border: 1px solid rgba(111, 143, 114, 0.35);
      border-radius: 20px;
      color: var(--sage-dark);
      background: #eef7ef;
    }

    .faq-card { padding: 0.9rem; }

    .faq-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 0;
      padding: 1rem;
      color: var(--ink);
      background: transparent;
      text-align: left;
      font-size: 1rem;
      font-weight: 800;
    }

    .faq-answer { padding: 0 1rem 1rem; color: var(--muted); }

    .footer {
      color: #e8d8c8;
      background: var(--ink);
    }

    .footer-main { padding: 4.5rem 0 3rem; }
    .footer-grid { display: grid; grid-template-columns: 1.2fr 0.8fr 1fr 1fr; gap: 2.5rem; }

    .footer-brand { margin-bottom: 1rem; color: white; font-family: "Cormorant Garamond", serif; font-size: 2rem; font-weight: 700; }
    .footer-brand span { color: var(--coral); }
    .footer-copy { max-width: 340px; color: #cdbdaf; }
    .footer h3 { margin-bottom: 1rem; color: white; font-size: 1.25rem; font-family: "Outfit", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .footer ul { list-style: none; padding: 0; margin: 0; }
    .footer li { margin-bottom: 0.62rem; color: #cdbdaf; }
    .footer a { color: #e8d8c8; }
    .footer a:hover, .footer a:focus { color: white; }
    .footer-contact-line { display: flex; gap: 0.6rem; margin-bottom: 0.7rem; color: #cdbdaf; }
    .footer-contact-line i { margin-top: 0.18rem; color: var(--coral); }

    .footer-bottom {
      padding: 1.2rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #bba99b;
      font-size: 0.9rem;
    }

    @media (max-width: 1200px) {
      .nav-links { gap: 0.85rem; }
      .nav-links a { font-size: 0.69rem; }
      .hero-grid { gap: 2.5rem; }
      .availability-card { left: 20px; }
    }

    @media (max-width: 992px) {
      .hero-grid,
      .process-grid { grid-template-columns: 1fr; }

      .hero-grid { padding: 4.5rem 0; }
      .hero-visual { min-height: auto; }
      .hero-image { height: 500px; }
      .availability-card { left: 24px; right: 24px; bottom: 24px; width: auto; }
      .process-image { min-height: 420px; }
      .visual-grid { grid-template-columns: 1fr 1fr; }
      .visual-tile:first-child { grid-column: 1 / -1; }
      .footer-grid { grid-template-columns: 1fr 1fr; }

      .nav-links {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 76px;
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 1.25rem 1.25rem;
        background: var(--ink);
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .nav-links.open { display: flex; }

      .nav-toggle {
        display: inline-flex;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 0.55rem 0.8rem;
        color: white;
        background: transparent;
      }
    }

    @media (max-width: 768px) {
      .section { padding: 4.8rem 0; }
      .service-card h3 { min-height: auto; }
      .service-card p { min-height: auto; }
      .visual-grid { grid-template-columns: 1fr; }
      .visual-tile:first-child { grid-column: auto; }
      .visual-tile { min-height: 330px; }
      .footer-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 576px) {
      .hero h1 { font-size: 3.55rem; }
      .hero-image { height: 430px; }
      .availability-card { left: 14px; right: 14px; bottom: 14px; }
      .section-title h2 { font-size: 3rem; }
      .service-actions { grid-template-columns: 1fr; }
      .process-panel { padding: 1.35rem; }
      .process-step { grid-template-columns: 52px 1fr; }
      .step-number { width: 48px; height: 48px; }
      .summary-item { grid-template-columns: 1fr; gap: 0.1rem; }
      .brand { font-size: 1.55rem; }
      .nav-inner { padding-inline: 0.9rem; }
      .nav-right { gap: 0.45rem; }
    }
  </style>
</head>

  <div id="root"></div>

    function Booking({ lang, selectedService, setSelectedService }) {
      const t = content[lang].booking;
      const services = serviceData[lang];
      const today = useMemo(() => formatDateInput(new Date()), []);
      const suggestedDate = useMemo(() => {
        const date = new Date();
        date.setDate(date.getDate() + 7);
        return formatDateInput(date);
      }, []);

      const [form, setForm] = useState({
        service: selectedService || "initiale",
        date: suggestedDate,
        time: "10:00",
        name: "",
        email: "",
        phone: "",
        notes: ""
      });
      const [submitted, setSubmitted] = useState(false);

      useEffect(() => {
        setForm((previous) => ({ ...previous, service: selectedService || previous.service }));
      }, [selectedService]);

      const chosen = services.find((service) => service.id === form.service) || services[0];

      function update(event) {
        const { name, value } = event.target;
        setForm((previous) => ({ ...previous, [name]: value }));
        setSubmitted(false);
        if (name === "service") setSelectedService(value);
      }

      function submit(event) {
        event.preventDefault();
        setSubmitted(true);
      }

      return (
        <section className="section alt" id="reservation">
          <div className="container">

              <div className="col-lg-7">
                <form className="booking-card" onSubmit={submit}>
                  <div className="row g-3">
                    <div className="col-md-6">
                      <label className="form-label" htmlFor="service">{t.labels.service}</label>
                      <select className="form-select" id="service" name="service" value={form.service} onChange={update}>
                        {services.map((service) => (
                          <option value={service.id} key={service.id}>{service.titre} — {service.prix}</option>
                        ))}
                      </select>
                    </div>

                    <div className="col-md-3">
                      <label className="form-label" htmlFor="date">{t.labels.date}</label>
                      <input className="form-control" type="date" id="date" name="date" min={today} value={form.date} onChange={update} required />
                    </div>

                    <div className="col-md-3">
                      <label className="form-label" htmlFor="time">{t.labels.time}</label>
                      <select className="form-select" id="time" name="time" value={form.time} onChange={update}>
                        <option value="09:00">09 h 00</option>
                        <option value="10:00">10 h 00</option>
                        <option value="14:30">14 h 30</option>
                        <option value="16:15">16 h 15</option>
                      </select>
                    </div>

                    <div className="col-md-6">
                      <label className="form-label" htmlFor="name">{t.labels.name}</label>
                      <input className="form-control" id="name" name="name" value={form.name} onChange={update} placeholder={t.placeholders.name} required />
                    </div>

                    <div className="col-md-6">
                      <label className="form-label" htmlFor="email">{t.labels.email}</label>
                      <input className="form-control" type="email" id="email" name="email" value={form.email} onChange={update} placeholder={t.placeholders.email} required />
                    </div>

                    <div className="col-md-6">
                      <label className="form-label" htmlFor="phone">{t.labels.phone}</label>
                      <input className="form-control" type="tel" id="phone" name="phone" value={form.phone} onChange={update} placeholder={t.placeholders.phone} required />
                    </div>

                    <div className="col-md-6">
                      <label className="form-label" htmlFor="notes">{t.labels.notes}</label>
                      <input className="form-control" id="notes" name="notes" value={form.notes} onChange={update} placeholder={t.placeholders.notes} />
                    </div>
                  </div>

                  <button className="btn-nutri mt-4" type="submit">
                    <i className="bi bi-calendar-check"></i> {t.button}
                  </button>

                  {submitted && (
                    <div className="confirmation mt-4" role="status" aria-live="polite">
                      <strong><i className="bi bi-check-circle"></i> {t.confirmed}</strong><br />
                      {t.thank} {form.name}. {t.request} <strong>{chosen.titre}</strong> {lang === "fr" ? "le" : "on"} <strong>{form.date}</strong> {lang === "fr" ? "à" : "at"} <strong>{form.time}</strong> {t.saved}

                  <h3>{t.summaryTitle}</h3>
                  <p>{t.summaryIntro}</p>
                  <div className="summary-item"><span>{t.labels.service}</span><strong>{chosen.titre}</strong></div>
                  <div className="summary-item"><span>{t.duration}</span><strong>{chosen.duree}</strong></div>
                  <div className="summary-item"><span>{t.price}</span><strong>{chosen.prix}</strong></div>
                  <div className="summary-item"><span>{t.labels.date}</span><strong>{form.date}</strong></div>
                  <div className="summary-item"><span>{t.labels.time}</span><strong>{form.time}</strong></div>
                </aside>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function FAQ({ lang }) {
      const [open, setOpen] = useState(0);
      const t = content[lang].faq;
      const faqs = faqData[lang];

      return (
        <section className="section" id="faq">
          <div className="container">
            <div className="section-title">
              <div className="eyebrow">{t.eyebrow}</div>
              <h2>{t.title}</h2>
              <p>{t.intro}</p>
            </div>

            <div className="row g-3">
              {faqs.map((item, index) => (
                <div className="col-lg-6" key={item.q}>
                  <article className="faq-card">
                    <button
                      className="faq-button"
                      type="button"
                      onClick={() => setOpen(open === index ? -1 : index)}
                      aria-expanded={open === index}
                    >
                      {item.q}
                      <i className={`bi ${open === index ? "bi-chevron-up" : "bi-chevron-down"}`}></i>
                    </button>
                    {open === index && <div className="faq-answer">{item.a}</div>}
                  </article>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Contact({ lang }) {
      const t = content[lang].contact;
      const contacts = contactData[lang];
      return (
        <section className="section" id="contact">
          <div className="container">
            <div className="section-title"><div className="eyebrow">{t.eyebrow}</div><h2>{t.title}</h2><p>{t.intro}</p></div>
            <div className="row g-4">
              <div className="col-lg-8"><div className="contact-card">{contacts.map(([icon, label, value]) => <div className="contact-line" key={label}><span className="icon-circle"><i className={`bi ${icon}`}></i></span><div><strong>{label}</strong><br /><span className="text-muted">{value}</span></div></div>)}</div></div>
              <div className="col-lg-4"><div className="contact-card"><h3>{t.designerTitle}</h3><p className="text-muted">{t.designerText}</p><a className="btn-nutri" href="index.html#projects">{t.back}</a></div></div>
            </div>
          </div>
        </section>
      );
    }

    function Footer({ lang }) {
      const t = content[lang].footer;
      return <footer className="footer"><div className="container d-flex flex-column flex-md-row justify-content-between gap-3"><span>{t.left}</span><span>{t.right} · <a href="index.html">Portfolio</a></span></div></footer>;
    }

    function App() {
      const urlLang = new URLSearchParams(window.location.search).get("lang");
      const [lang, setLang] = useState(urlLang === "en" ? "en" : "fr");
      const [selectedService, setSelectedService] = useState(getInitialService());

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      useEffect(() => {
        function updateProgress() {
          const page = document.documentElement;
          const scrollTop = page.scrollTop || document.body.scrollTop;
          const scrollHeight = page.scrollHeight - page.clientHeight;
          const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
          const bar = document.getElementById("progress");
          if (bar) bar.style.width = `${progress}%`;
        }

        window.addEventListener("scroll", updateProgress);
        updateProgress();
        return () => window.removeEventListener("scroll", updateProgress);
      }, []);

      useEffect(() => {
        if (window.location.hash === "#reservation") {
          setTimeout(() => document.getElementById("reservation")?.scrollIntoView({ behavior: "smooth" }), 180);
        }
      }, []);

      function book(id) {
        setSelectedService(id);
        setTimeout(() => document.getElementById("reservation")?.scrollIntoView({ behavior: "smooth" }), 60);
      }

      return (
        <>
          <Header lang={lang} setLang={setLang} />
          <main id="contenu">
            <Hero lang={lang} onBook={book} />
            <Services lang={lang} selectedService={selectedService} onBook={book} />
            <Process lang={lang} />
            <Approach lang={lang} />
            <VisualStories lang={lang} />
            <Booking lang={lang} selectedService={selectedService} setSelectedService={setSelectedService} />
            <FAQ lang={lang} />
          </main>
          <Footer lang={lang} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
