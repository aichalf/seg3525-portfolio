    :root {
      --cream: #f7f1e8;
      --cream-2: #fffaf3;
      --sage: #6f8f72;
      --sage-dark: #36543a;
      --coral: #d9826b;
      --coral-dark: #9e4f3e;
      --ink: #2f241d;
      --muted: #6e5a4d;
      --line: #dfd1c2;
      --shadow: 0 18px 45px rgba(47, 36, 29, .12);

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;

    .skip-link {
      position: absolute; left: -999px; top: 0; background: var(--ink); color: white; padding: .8rem 1rem; z-index: 9999;
    }
    .skip-link:focus { left: 1rem; top: 1rem; }

    .site-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(47, 36, 29, .96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(247,241,232,.18);
    }
    .nav-inner {
      max-width: 1180px; min-height: 72px; margin: 0 auto;
      padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .brand {
      color: var(--cream-2); font-family: "Cormorant Garamond", serif;
      font-size: 1.65rem; font-weight: 700; letter-spacing: .02em;
      display: flex; align-items: center; gap: .55rem; white-space: nowrap;
    }
    .brand span { color: var(--coral); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-links { display: flex; align-items: center; gap: 1.25rem; list-style: none; margin: 0; padding: 0; }
    .nav-links a {
      color: #e8d8c8; font-size: .74rem; text-transform: uppercase; letter-spacing: .11em; font-weight: 700;
    }
    .nav-links a:hover, .nav-links a:focus { color: white; }
    .lang-switcher {
      display: inline-flex; border: 1px solid rgba(232,216,200,.55); border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,.04); flex-shrink: 0;
    }
    .lang-btn {
      border: 0; background: transparent; color: #e8d8c8; padding: .42rem .68rem;
      font-size: .72rem; font-weight: 800; letter-spacing: .08em; cursor: pointer;
    }
    .lang-btn.active { background: var(--coral); color: white; }
    .nav-toggle { display: none; }
    .btn-nutri {
      border: 0; border-radius: 999px; padding: .85rem 1.35rem; font-weight: 700;
      background: var(--coral); color: white; box-shadow: 0 10px 22px rgba(217,130,107,.24);
      transition: transform .2s ease, background .2s ease;
    }
    .btn-nutri:hover, .btn-nutri:focus { transform: translateY(-2px); background: var(--coral-dark); color: white; }
    .btn-outline-nutri {
      border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: .78rem 1.15rem;
      color: var(--cream-2); background: transparent; font-weight: 700;
    }
    .btn-outline-nutri:hover, .btn-outline-nutri:focus { background: var(--cream-2); color: var(--ink); }

    .hero {
      position: relative; overflow: hidden; min-height: calc(100vh - 72px);
      display: flex; align-items: center;
      background:
        radial-gradient(circle at 88% 22%, rgba(111,143,114,.24), transparent 32%),
        radial-gradient(circle at 15% 88%, rgba(217,130,107,.20), transparent 34%),
        linear-gradient(135deg, var(--cream-2), var(--cream));
      border-bottom: 1px solid var(--line);
    }
    .hero::after {
      content: ""; position: absolute; width: 420px; height: 420px; border: 1px solid rgba(111,143,114,.35);
      border-radius: 50%; right: -160px; bottom: -130px;
    }
    .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr .85fr; gap: 3.5rem; align-items: center; padding: 6rem 0; }
    .eyebrow { color: var(--sage-dark); font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: .65rem; }
    .eyebrow::before { content: ""; width: 42px; height: 2px; background: var(--coral); }
    .hero h1 { font-size: clamp(3.4rem, 7vw, 6.8rem); line-height: .92; margin: 0; letter-spacing: -.03em; }
    .hero h1 em { color: var(--sage-dark); font-style: italic; }
    .hero p { color: var(--muted); font-size: 1.12rem; max-width: 670px; margin: 1.4rem 0 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .85rem; margin-top: 2rem; }
    .trust-row { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2.2rem; }
    .trust-pill { border: 1px solid var(--line); background: rgba(255,250,243,.72); color: var(--sage-dark); border-radius: 999px; padding: .55rem .85rem; font-size: .84rem; font-weight: 700; }

    .hero-card {
      background: rgba(255,250,243,.92); border: 1px solid var(--line); border-radius: 28px;
      padding: 1.5rem; box-shadow: var(--shadow); position: relative;

    .appointment-preview h3 { color: white; font-size: 1.7rem; margin-bottom: .7rem; }
    .preview-line { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid rgba(255,255,255,.14); color: #eadbd0; }
    .preview-line:last-child { border-bottom: 0; }
    .mini-card { display: grid; grid-template-columns: 46px 1fr; gap: .85rem; align-items: start; padding: 1rem; border-radius: 18px; background: white; border: 1px solid var(--line); }
    .icon-circle { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--sage); font-size: 1.2rem; }

    .section { padding: 5.6rem 0; border-bottom: 1px solid var(--line); }
    .section.alt { background: var(--cream-2); }
    .section-title { max-width: 760px; margin-bottom: 2.6rem; }
    .section-title h2 { font-size: clamp(2.2rem, 4vw, 4rem); line-height: 1; margin-bottom: .8rem; }
    .section-title p { color: var(--muted); margin: 0; }

    .service-card, .why-card, .faq-card, .booking-card, .contact-card {
      background: white; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 14px 30px rgba(47,36,29,.07);
    }
    .service-card { padding: 1.35rem; height: 100%; transition: transform .2s ease, border-color .2s ease; }
    .service-card:hover { transform: translateY(-5px); border-color: rgba(111,143,114,.65); }
    .service-top { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .service-card h3 { font-size: 1.65rem; margin: 0; }
    .service-price { color: var(--coral-dark); font-weight: 800; white-space: nowrap; }
    .service-meta { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1rem 0; }
    .tag { background: #f1e7d9; color: var(--sage-dark); border-radius: 999px; padding: .35rem .65rem; font-size: .78rem; font-weight: 700; }
    .service-card ul { padding-left: 1.2rem; color: var(--muted); margin-bottom: 1.2rem; }

    .why-card { padding: 1.35rem; height: 100%; }
    .why-card h3 { font-size: 1.45rem; margin: 1rem 0 .45rem; }
    .why-card p { color: var(--muted); margin: 0; }

    .booking-card { padding: 1.5rem; }
    .summary-panel { background: var(--sage-dark); color: white; border-radius: 24px; padding: 1.4rem; height: 100%; }
    .summary-panel h3 { color: white; font-size: 1.75rem; }
    .summary-item { display: grid; grid-template-columns: 130px 1fr; gap: .75rem; padding: .72rem 0; border-bottom: 1px solid rgba(255,255,255,.15); }
    .summary-item span:first-child { color: #cfe0d0; font-weight: 700; }
    .form-label { font-weight: 800; color: var(--ink); }
    .form-control, .form-select { border-radius: 14px; border-color: var(--line); padding: .8rem .95rem; }
    .form-control:focus, .form-select:focus { border-color: var(--sage); box-shadow: 0 0 0 .2rem rgba(111,143,114,.15); }
    .confirmation {
      border-radius: 22px; background: #eef7ef; border: 1px solid rgba(111,143,114,.35); padding: 1.2rem; color: var(--sage-dark);
    }

    .faq-card { padding: 1rem; }
    .faq-button { width: 100%; border: 0; background: transparent; text-align: left; padding: 1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
    .faq-answer { padding: 0 1rem 1rem; color: var(--muted); }

    .contact-card { padding: 1.4rem; height: 100%; }
    .contact-line { display: grid; grid-template-columns: 42px 1fr; gap: .8rem; align-items: start; padding: .75rem 0; border-bottom: 1px solid var(--line); }
    .contact-line:last-child { border-bottom: 0; }

    .footer { background: var(--ink); color: #e8d8c8; padding: 2rem 0; }
    .footer a { color: white; text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 992px) {
      .hero-grid { grid-template-columns: 1fr; padding: 4.5rem 0; }
      .nav-right { gap: .55rem; }
      .nav-links { display: none; position: absolute; left: 0; right: 0; top: 72px; background: var(--ink); padding: 1rem; flex-direction: column; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,.15); }
      .nav-links.open { display: flex; }
      .nav-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.35); background: transparent; color: white; border-radius: 999px; padding: .55rem .8rem; }
    }
    @media (max-width: 576px) {
      .hero h1 { font-size: 3.2rem; }
      .section { padding: 4rem 0; }
      .summary-item { grid-template-columns: 1fr; gap: .1rem; }
      .brand { font-size: 1.35rem; }
    }
  </style>
</head>

        <section className="hero" id="accueil">
          <div className="container">
            <div className="hero-grid">
              <div>
                <div className="eyebrow">{h.eyebrow}</div>
                <h1>{h.titleA} <br/><em>{h.titleB}</em> {h.titleC}</h1>
                <p>{h.lead}</p>
                <div className="hero-actions">
                  <button className="btn-nutri" type="button" onClick={() => onBook("initiale")}>{h.book}</button>
                  <a className="btn-outline-nutri" href="#services">{h.compare}</a>
                </div>
                <div className="trust-row" aria-label="Points de confiance">
                  <span className="trust-pill"><i className="bi bi-check2-circle"></i> {h.pills[0]}</span>
                  <span className="trust-pill"><i className="bi bi-calendar2-check"></i> {h.pills[1]}</span>
                  <span className="trust-pill"><i className="bi bi-phone"></i> {h.pills[2]}</span>
                </div>
              </div>
              <aside className="hero-card" aria-label={h.availability}>
                <div className="appointment-preview">
                  <h3>{h.availability}</h3>
                  <div className="preview-line"><span>{h.today}</span><strong>14 h 30</strong></div>
                  <div className="preview-line"><span>{h.tomorrow}</span><strong>10 h 00</strong></div>
                  <div className="preview-line"><span>{h.friday}</span><strong>16 h 15</strong></div>
                </div>
                <div className="mini-card">
                  <span className="icon-circle"><i className="bi bi-chat-heart"></i></span>
                  <div>
                    <strong>{h.reassuranceTitle}</strong>
                    <p className="mb-0 text-muted">{h.reassuranceText}</p>
                  </div>
                </div>
              </aside>
            </div>
          </div>
        </section>
      );
    }

    function Services({ lang, selectedService, onBook }) {
      const t = content[lang];
      const services = serviceData[lang];
      return (
        <section className="section alt" id="services">
          <div className="container">
            <div className="section-title">
              <div className="eyebrow">{t.nav.services}</div>
              <h2>{t.servicesTitle}</h2>
              <p>{t.servicesIntro}</p>
            </div>
            <div className="row g-4">
              {services.map(service => (
                <div className="col-md-6 col-xl-3" key={service.id}>
                  <article className="service-card" aria-label={service.titre}>
                    <div className="service-top">
                      <span className="icon-circle"><i className={`bi ${service.icon}`}></i></span>
                      <span className="service-price">{service.prix}</span>
                    </div>
                    <h3>{service.titre}</h3>
                    <div className="service-meta">
                      <span className="tag"><i className="bi bi-clock"></i> {service.duree}</span>
                      <span className="tag">{service.cible}</span>
                    </div>
                    <p className="text-muted">{service.description}</p>
                    <ul>{service.inclus.map(item => <li key={item}>{item}</li>)}</ul>
                    <button className="btn-nutri w-100" type="button" onClick={() => onBook(service.id)}>
                      {selectedService === service.id ? t.selected : t.reserveThis}
                    </button>
                  </article>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Approach({ lang }) {
      const a = content[lang].approach;
      return (
        <section className="section" id="approche">
          <div className="container">
            <div className="section-title">
              <div className="eyebrow">{a.eyebrow}</div>
              <h2>{a.title}</h2>
              <p>{a.intro}</p>
            </div>
            <div className="row g-4">
              {a.items.map(([icon, title, text]) => (
                <div className="col-md-6 col-xl-3" key={title}>
                  <article className="why-card">
                    <span className="icon-circle"><i className={`bi ${icon}`}></i></span>
                    <h3>{title}</h3>
                    <p>{text}</p>
                  </article>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Booking({ lang, selectedService, setSelectedService }) {
      const t = content[lang].booking;
      const services = serviceData[lang];
      const [form, setForm] = useState({ service: selectedService || "initiale", date: "2026-06-12", time: "10:00", name: "", email: "", phone: "", notes: "" });
      const [submitted, setSubmitted] = useState(false);
      React.useEffect(() => setForm(prev => ({ ...prev, service: selectedService || prev.service })), [selectedService]);
      const chosen = services.find(s => s.id === form.service) || services[0];
      function update(e) { const { name, value } = e.target; setForm(prev => ({ ...prev, [name]: value })); if (name === "service") setSelectedService(value); }
      function submit(e) { e.preventDefault(); setSubmitted(true); }

      return (
        <section className="section" id="reservation">
          <div className="container">
            <div className="section-title">
              <div className="eyebrow">{t.eyebrow}</div>
              <h2>{t.title}</h2>
              <p>{t.intro}</p>
            </div>
            <div className="row g-4 align-items-stretch">
              <div className="col-lg-7">
                <form className="booking-card" onSubmit={submit}>
                  <div className="row g-3">
                    <div className="col-md-6">
                      <label className="form-label" htmlFor="service">{t.labels.service}</label>
                      <select className="form-select" id="service" name="service" value={form.service} onChange={update}>
                        {services.map(s => <option value={s.id} key={s.id}>{s.titre} - {s.prix}</option>)}
                      </select>
                    </div>
                    <div className="col-md-3"><label className="form-label" htmlFor="date">{t.labels.date}</label><input className="form-control" type="date" id="date" name="date" value={form.date} onChange={update} required /></div>
                    <div className="col-md-3"><label className="form-label" htmlFor="time">{t.labels.time}</label><select className="form-select" id="time" name="time" value={form.time} onChange={update}><option value="09:00">09 h 00</option><option value="10:00">10 h 00</option><option value="14:30">14 h 30</option><option value="16:15">16 h 15</option></select></div>
                    <div className="col-md-6"><label className="form-label" htmlFor="name">{t.labels.name}</label><input className="form-control" id="name" name="name" value={form.name} onChange={update} placeholder={t.placeholders.name} required /></div>
                    <div className="col-md-6"><label className="form-label" htmlFor="email">{t.labels.email}</label><input className="form-control" type="email" id="email" name="email" value={form.email} onChange={update} placeholder={t.placeholders.email} required /></div>
                    <div className="col-md-6"><label className="form-label" htmlFor="phone">{t.labels.phone}</label><input className="form-control" type="tel" id="phone" name="phone" value={form.phone} onChange={update} placeholder={t.placeholders.phone} required /></div>
                    <div className="col-md-6"><label className="form-label" htmlFor="notes">{t.labels.notes}</label><input className="form-control" id="notes" name="notes" value={form.notes} onChange={update} placeholder={t.placeholders.notes} /></div>
                  </div>
                  <button className="btn-nutri mt-4" type="submit"><i className="bi bi-calendar-check"></i> {t.button}</button>
                  {submitted && <div className="confirmation mt-4" role="status" aria-live="polite"><strong><i className="bi bi-check-circle"></i> {t.confirmed}</strong><br />{t.thank} {form.name || ""}. {t.request} <strong>{chosen.titre}</strong> {lang === "fr" ? "le" : "on"} <strong>{form.date}</strong> {lang === "fr" ? "à" : "at"} <strong>{form.time}</strong> {t.saved}</div>}
                </form>
              </div>
              <div className="col-lg-5">
                <aside className="summary-panel">
                  <h3>{t.summaryTitle}</h3>
                  <p>{t.summaryIntro}</p>
                  <div className="summary-item"><span>{t.labels.service}</span><strong>{chosen.titre}</strong></div>
                  <div className="summary-item"><span>{t.duration}</span><strong>{chosen.duree}</strong></div>
                  <div className="summary-item"><span>{t.price}</span><strong>{chosen.prix}</strong></div>
                  <div className="summary-item"><span>{t.labels.date}</span><strong>{form.date}</strong></div>
                  <div className="summary-item"><span>{t.labels.time}</span><strong>{form.time}</strong></div>
                </aside>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function FAQ({ lang }) {
      const [open, setOpen] = useState(0);
      const t = content[lang].faq;
      const faqs = faqData[lang];
      return (
        <section className="section alt" id="faq">
          <div className="container">
            <div className="section-title">
              <div className="eyebrow">{t.eyebrow}</div>
              <h2>{t.title}</h2>
              <p>{t.intro}</p>
            </div>
            <div className="row g-3">
              {faqs.map((item, index) => (
                <div className="col-lg-6" key={item.q}>
                  <article className="faq-card">
                    <button className="faq-button" type="button" onClick={() => setOpen(open === index ? -1 : index)} aria-expanded={open === index}>{item.q}<i className={`bi ${open === index ? "bi-chevron-up" : "bi-chevron-down"}`}></i></button>
                    {open === index && <div className="faq-answer">{item.a}</div>}
                  </article>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Contact({ lang }) {
      const t = content[lang].contact;
      const contacts = contactData[lang];
      return (
        <section className="section" id="contact">
          <div className="container">
            <div className="section-title"><div className="eyebrow">{t.eyebrow}</div><h2>{t.title}</h2><p>{t.intro}</p></div>
            <div className="row g-4">
              <div className="col-lg-8"><div className="contact-card">{contacts.map(([icon, label, value]) => <div className="contact-line" key={label}><span className="icon-circle"><i className={`bi ${icon}`}></i></span><div><strong>{label}</strong><br/><span className="text-muted">{value}</span></div></div>)}</div></div>
              <div className="col-lg-4"><div className="contact-card"><h3>{t.designerTitle}</h3><p className="text-muted">{t.designerText}</p><a className="btn-nutri" href="index.html#projects">{t.back}</a></div></div>
            </div>
          </div>
        </section>
      );
    }

    function Footer({ lang }) {
      const t = content[lang].footer;
      return <footer className="footer"><div className="container d-flex flex-column flex-md-row justify-content-between gap-3"><span>{t.left}</span><span>{t.right} · <a href="index.html">Portfolio</a></span></div></footer>;
    }

    function App() {
      const [lang, setLang] = useState("fr");
      const [selectedService, setSelectedService] = useState("initiale");
      React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
      function book(id) { setSelectedService(id); setTimeout(() => document.getElementById("reservation")?.scrollIntoView({ behavior: "smooth" }), 60); }
      return (
        <>
          <Header lang={lang} setLang={setLang} />
          <main id="contenu">
            <Hero lang={lang} onBook={book} />
            <Services lang={lang} selectedService={selectedService} onBook={book} />
            <Approach lang={lang} />
            <Booking lang={lang} selectedService={selectedService} setSelectedService={setSelectedService} />
            <FAQ lang={lang} />
            <Contact lang={lang} />
          </main>
          <Footer lang={lang} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
