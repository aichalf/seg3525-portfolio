<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mémoria, un jeu de mémoire interactif conçu pour le Devoir 3 du cours SEG3525.">
  <title>Mémoria | Aicha Lfakir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f3f6fc;
  --bg-alt: #e6eaf8;
  --surface: #f8faff;
  --surface-strong: #ffffff;
  --accent: #6c7bd9;
  --accent-dark: #4254b5;
  --olive: #4cb7a5;
  --olive-soft: #dff4ef;
  --ink: #1d2433;
  --ink-soft: #3f4a63;
  --muted: #6b7280;
  --line: rgba(108, 123, 217, 0.5);
  --line-soft: rgba(29, 36, 51, 0.12);
  --danger: #c65c5c;
  --shadow: 0 24px 70px rgba(29, 36, 51, 0.1);
  --shadow-soft: 0 14px 36px rgba(29, 36, 51, 0.08);
  --radius: 18px;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 12%, rgba(108, 123, 217, 0.14), transparent 28%),
    radial-gradient(circle at 88% 72%, rgba(76, 183, 165, 0.08), transparent 24%),
    linear-gradient(180deg, var(--surface), var(--bg));
  font-family: var(--sans);
  line-height: 1.55;
}

button,
input,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 3px solid rgba(76, 183, 165, 0.45);
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  left: 1rem;
  top: -5rem;
  z-index: 1000;
  padding: 0.75rem 1rem;
  background: var(--surface-strong);
  color: var(--ink);
  border: 2px solid var(--ink);
  text-decoration: none;
  font-weight: 700;
}

.skip-link:focus {
  top: 1rem;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem clamp(1rem, 4vw, 3rem);
  color: var(--surface);
  background: rgba(29, 36, 51, 0.97);
  border-bottom: 1px solid rgba(108, 123, 217, 0.3);
  backdrop-filter: blur(10px);
}

.brand {
  color: var(--surface);
  font-family: var(--serif);
  font-size: 1.35rem;
  font-style: italic;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.11em;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 180ms ease;
}

.back-link:hover {
  color: var(--surface);
}

.lang-switcher {
  display: inline-flex;
  overflow: hidden;
  border: 1px solid var(--accent);
  border-radius: 4px;
}

.lang-button {
  min-width: 44px;
  min-height: 34px;
  padding: 0.4rem 0.75rem;
  border: 0;
  color: var(--accent);
  background: transparent;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.1em;
}

.lang-button[aria-pressed="true"] {
  color: var(--ink);
  background: var(--accent);
}

#root {
  min-height: calc(100vh - 116px);
}

.page-main {
  width: min(1220px, calc(100% - 2rem));
  margin: 0 auto;
  padding: clamp(2rem, 5vw, 5rem) 0;
}

.setup-shell,
.game-shell,
.result-shell {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(248, 250, 255, 0.9);
  box-shadow: var(--shadow);
}

.setup-shell::after,
.game-shell::after,
.result-shell::after {
  content: "";
  position: absolute;
  right: -140px;
  top: -150px;
  width: 340px;
  height: 340px;
  border: 1px solid var(--line);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.65;
}

.setup-shell {
  display: grid;
  grid-template-columns: minmax(300px, 0.84fr) minmax(0, 1.35fr);
}

.intro-panel {
  position: relative;
  z-index: 1;
  display: flex;
  min-height: 680px;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(2.2rem, 5vw, 4rem);
  color: var(--surface);
  background:
    linear-gradient(160deg, rgba(76, 183, 165, 0.12), transparent 45%),
    var(--ink);
}

.project-number {
  display: block;
  margin-bottom: 1.2rem;
  color: var(--accent);
  font-family: var(--serif);
  font-size: clamp(5rem, 10vw, 7.5rem);
  font-style: italic;
  font-weight: 400;
  line-height: 0.8;
}

.kicker,
.eyebrow {
  margin: 0 0 0.8rem;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.intro-title,
.page-title,
.result-title {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  line-height: 1;
}

.intro-title {
  max-width: 440px;
  font-size: clamp(3.1rem, 7vw, 5.5rem);
}

.intro-copy {
  max-width: 420px;
  margin: 1.4rem 0 0;
  color: #dce3f7;
  font-size: 1rem;
}

.principle-list {
  display: grid;
  gap: 0.8rem;
  margin-top: 2.5rem;
}

.principle-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: #e1e6f5;
  font-size: 0.84rem;
}

.principle-icon {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid rgba(108, 123, 217, 0.6);
  border-radius: 50%;
  color: var(--accent);
}

.intro-note {
  margin: 2.5rem 0 0;
  padding-top: 1.25rem;
  border-top: 1px solid rgba(108, 123, 217, 0.45);
  color: var(--accent);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.config-panel {
  position: relative;
  z-index: 1;
  padding: clamp(2rem, 5vw, 4rem);
}

.section-heading {
  margin-bottom: 2rem;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: var(--accent-dark);
}

.eyebrow::before {
  content: "";
  width: 34px;
  height: 1px;
  background: currentColor;
}

.page-title {
  font-size: clamp(2.55rem, 5vw, 4rem);
}

.section-description {
  max-width: 670px;
  margin: 0.85rem 0 0;
  color: var(--ink-soft);
}

.option-group {
  margin-top: 2rem;
  padding-top: 1.75rem;
  border-top: 1px solid var(--line);
}

.option-group:first-of-type {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.option-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.option-title {
  margin: 0;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.option-help {
  margin: 0;
  color: var(--muted);
  font-size: 0.78rem;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.85rem;
}

.choice-card {
  position: relative;
  min-height: 126px;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(230, 234, 248, 0.42);
  cursor: pointer;
  text-align: left;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
}

.choice-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent-dark);
}

.choice-card[aria-pressed="true"] {
  border: 2px solid var(--ink);
  background: var(--surface-strong);
  box-shadow: 0 0 0 4px rgba(108, 123, 217, 0.16);
}

.choice-card[aria-pressed="true"]::after {
  content: "✓";
  position: absolute;
  right: 0.75rem;
  top: 0.65rem;
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 50%;
  color: var(--surface-strong);
  background: var(--olive);
  font-size: 0.72rem;
  font-weight: 800;
}

.choice-icon {
  display: block;
  margin-bottom: 0.55rem;
  font-size: 1.7rem;
  line-height: 1;
}

.choice-name {
  display: block;
  font-weight: 700;
}

.choice-detail {
  display: block;
  margin-top: 0.3rem;
  color: var(--muted);
  font-size: 0.78rem;
}

.preview-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem;
  padding: 1rem 1.1rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(230, 234, 248, 0.42);
}

.preview-copy strong,
.preview-copy span {
  display: block;
}

.preview-copy strong {
  font-size: 0.92rem;
}

.preview-copy span {
  margin-top: 0.18rem;
  color: var(--muted);
  font-size: 0.78rem;
}

.switch {
  position: relative;
  width: 54px;
  height: 30px;
  flex: 0 0 auto;
  border: 0;
  border-radius: 999px;
  background: #c5cee7;
  cursor: pointer;
  transition: background 180ms ease;
}

.switch::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 8px rgba(29, 36, 51, 0.2);
  transition: transform 180ms ease;
}

.switch[aria-pressed="true"] {
  background: var(--olive);
}

.switch[aria-pressed="true"]::after {
  transform: translateX(24px);
}

.config-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.5rem;
}

.summary-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.55);
  font-size: 0.76rem;
}

.primary-button,
.secondary-button,
.text-button {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: background 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.primary-button {
  padding: 0.85rem 1.35rem;
  border: 1.5px solid var(--ink);
  color: var(--surface);
  background: var(--ink);
}

.primary-button:hover {
  color: var(--ink);
  background: transparent;
}

.secondary-button {
  padding: 0.8rem 1.2rem;
  border: 1.5px solid var(--accent-dark);
  color: var(--ink);
  background: transparent;
}

.secondary-button:hover {
  background: var(--accent);
}

.text-button {
  min-height: 40px;
  padding: 0.45rem 0.7rem;
  border: 0;
  color: var(--accent-dark);
  background: transparent;
}

.text-button:hover {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.config-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 2rem;
}

.instructions {
  margin-top: 1.5rem;
  border-top: 1px solid var(--line);
}

.instructions summary {
  padding: 1.1rem 0 0;
  color: var(--accent-dark);
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.instructions ol {
  margin: 1rem 0 0;
  padding-left: 1.2rem;
  color: var(--ink-soft);
}

.instructions li + li {
  margin-top: 0.55rem;
}

.game-shell {
  padding: clamp(1.25rem, 3vw, 2.25rem);
}

.game-header {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.5rem;
  padding-bottom: 1.4rem;
  border-bottom: 1px solid var(--line);
}

.game-heading-wrap {
  min-width: 0;
}

.game-title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.25rem, 4vw, 3.4rem);
  font-weight: 500;
  line-height: 1;
}

.game-subtitle {
  margin: 0.65rem 0 0;
  color: var(--ink-soft);
}

.game-layout {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: clamp(1.25rem, 3vw, 2.5rem);
  margin-top: 1.75rem;
}

.stats-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.stats-card,
.feedback-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(230, 234, 248, 0.42);
}

.stats-card {
  padding: 1rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.75rem;
}

.stat-box {
  min-height: 88px;
  padding: 0.85rem;
  border: 1px solid rgba(108, 123, 217, 0.38);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.62);
}

.stat-label {
  display: block;
  color: var(--muted);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.stat-value {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 600;
  line-height: 1;
}

.progress-block {
  margin-top: 1rem;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  color: var(--ink-soft);
  font-size: 0.76rem;
}

.progress-track {
  height: 8px;
  margin-top: 0.55rem;
  overflow: hidden;
  border-radius: 999px;
  background: #d4daee;
}

.progress-bar {
  height: 100%;
  border-radius: inherit;
  background: var(--olive);
  transition: width 240ms ease;
}

.feedback-card {
  min-height: 96px;
  padding: 1rem;
}

.feedback-label {
  color: var(--accent-dark);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.feedback-message {
  margin: 0.45rem 0 0;
  color: var(--ink-soft);
  font-size: 0.88rem;
}

.side-actions {
  display: grid;
  gap: 0.7rem;
}

.side-actions .secondary-button,
.side-actions .text-button {
  width: 100%;
}

.board-panel {
  min-width: 0;
}

.preview-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  margin-bottom: 1rem;
  padding: 0.75rem 1rem;
  border: 1px solid var(--accent-dark);
  border-radius: 10px;
  color: var(--ink);
  background: rgba(108, 123, 217, 0.18);
  font-weight: 700;
}

.board {
  display: grid;
  grid-template-columns: repeat(var(--columns, 4), minmax(0, 1fr));
  gap: clamp(0.55rem, 1.5vw, 1rem);
  width: 100%;
}

.memory-card {
  position: relative;
  aspect-ratio: 0.82;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  perspective: 1000px;
}

.memory-card:disabled {
  cursor: default;
}

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
}

.memory-card.is-flipped .card-inner,
.memory-card.is-matched .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 14px;
  backface-visibility: hidden;
}

.card-back {
  border: 1px solid rgba(108, 123, 217, 0.6);
  background:
    radial-gradient(circle at center, rgba(108, 123, 217, 0.22) 0 10%, transparent 11%),
    linear-gradient(45deg, transparent 47%, rgba(108, 123, 217, 0.17) 48% 52%, transparent 53%),
    linear-gradient(-45deg, transparent 47%, rgba(108, 123, 217, 0.17) 48% 52%, transparent 53%),
    var(--ink);
  background-size: 54px 54px, 30px 30px, 30px 30px;
  box-shadow: var(--shadow-soft);
}

.card-back-mark {
  display: grid;
  width: 54%;
  aspect-ratio: 1;
  place-items: center;
  border: 1px solid rgba(108, 123, 217, 0.66);
  border-radius: 50%;
  color: var(--accent);
  font-family: var(--serif);
  font-size: clamp(1.5rem, 4vw, 2.4rem);
  font-style: italic;
}

.card-front {
  transform: rotateY(180deg);
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface-strong);
  box-shadow: var(--shadow-soft);
}

.card-content {
  display: grid;
  place-items: center;
  gap: 0.5rem;
  padding: 0.6rem;
  text-align: center;
}

.card-symbol {
  font-size: clamp(2rem, 5vw, 3.8rem);
  line-height: 1;
}

.card-name {
  color: var(--ink-soft);
  font-size: clamp(0.62rem, 1.2vw, 0.82rem);
  font-weight: 700;
}

.matched-badge {
  position: absolute;
  right: 0.55rem;
  top: 0.55rem;
  display: grid;
  width: 25px;
  height: 25px;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: var(--olive);
  font-size: 0.72rem;
  font-weight: 800;
}

.memory-card.is-matched .card-front {
  border: 2px solid var(--olive);
  background: var(--olive-soft);
}

.result-shell {
  display: grid;
  grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.25fr);
}

.result-visual {
  position: relative;
  z-index: 1;
  display: grid;
  min-height: 610px;
  place-items: center;
  padding: 3rem;
  color: var(--surface);
  background: var(--ink);
  text-align: center;
}

.result-medallion {
  display: grid;
  width: min(260px, 70vw);
  aspect-ratio: 1;
  place-items: center;
  border: 1px solid rgba(108, 123, 217, 0.65);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(108, 123, 217, 0.17), transparent 67%);
}

.result-check {
  display: grid;
  width: 108px;
  height: 108px;
  place-items: center;
  border: 2px solid var(--accent);
  border-radius: 50%;
  color: var(--accent);
  font-size: 3rem;
}

.result-stars {
  margin-top: 1rem;
  color: var(--accent);
  font-size: 1.45rem;
  letter-spacing: 0.18em;
}

.result-content {
  position: relative;
  z-index: 1;
  padding: clamp(2rem, 5vw, 4rem);
}

.result-title {
  font-size: clamp(3rem, 6vw, 4.8rem);
}

.result-copy {
  max-width: 620px;
  margin: 1rem 0 0;
  color: var(--ink-soft);
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.9rem;
  margin-top: 2rem;
}

.result-metric {
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(230, 234, 248, 0.45);
}

.result-metric-label {
  display: block;
  color: var(--muted);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.result-metric-value {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 600;
  line-height: 1;
}

.best-box {
  margin-top: 1rem;
  padding: 1rem 1.15rem;
  border-left: 4px solid var(--olive);
  color: var(--ink-soft);
  background: var(--olive-soft);
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin-top: 2rem;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
