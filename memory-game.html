<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mémoria, un jeu de mémoire visuelle accessible développé avec React.">
  <meta name="theme-color" content="#202a44">
  <title>Mémoria | Jeu de mémoire</title>
  <style>
    :root {
      --bg: #f5f6fb;
      --surface: #ffffff;
      --surface-soft: #f9faff;
      --night: #202a44;
      --night-2: #303b5c;
      --lavender: #6c72d9;
      --lavender-dark: #4f56b7;
      --lavender-soft: #e9eafb;
      --success: #2f8f7e;
      --success-soft: #ddf3ed;
      --gold: #b77d08;
      --gold-soft: #fff2c9;
      --danger: #b84c5c;
      --danger-soft: #fde7ea;
      --text: #202535;
      --muted: #667086;
      --line: #dce1ec;
      --shadow-sm: 0 10px 30px rgba(32, 42, 68, 0.08);
      --shadow-md: 0 24px 70px rgba(32, 42, 68, 0.13);
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 32px;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(108, 114, 217, 0.13), transparent 24rem),
        radial-gradient(circle at 92% 78%, rgba(47, 143, 126, 0.09), transparent 23rem),
        var(--bg);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(108, 114, 217, 0.38);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .skip-link {
      position: fixed;
      top: -5rem;
      left: 1rem;
      z-index: 1000;
      padding: 0.75rem 1rem;
      color: var(--surface);
      background: var(--night);
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 1rem;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(220, 225, 236, 0.9);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
    }

    .nav-shell {
      width: min(1180px, calc(100% - 2rem));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--night);
      text-decoration: none;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--surface);
      background: var(--night);
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .portfolio-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 42px;
      padding: 0.65rem 0.9rem;
      color: var(--night);
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease, color 160ms ease;
    }

    .portfolio-link:hover {
      color: var(--lavender-dark);
      background: var(--lavender-soft);
    }

    .language-switcher {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .language-button {
      min-width: 42px;
      min-height: 36px;
      padding: 0.4rem 0.65rem;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .language-button[aria-pressed="true"] {
      color: var(--surface);
      background: var(--night);
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4.6rem) 0;
    }

    .screen {
      animation: screen-in 300ms ease both;
    }

    @keyframes screen-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .setup-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(520px, 1.1fr);
      gap: clamp(1.5rem, 4vw, 3.25rem);
      align-items: start;
    }

    .intro-block {
      position: sticky;
      top: 110px;
      padding: clamp(1rem, 3vw, 2rem) 0;
    }

    .eyebrow {
      margin: 0 0 0.85rem;
      color: var(--lavender-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .intro-title {
      max-width: 660px;
      margin-bottom: 1rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 8vw, 6.6rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
    }

    .intro-tagline {
      max-width: 560px;
      margin-bottom: 2rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
    }

    .how-to-play {
      display: grid;
      gap: 0.85rem;
      max-width: 520px;
    }

    .how-step {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 0.85rem;
      align-items: center;
      padding: 0.85rem 0;
      border-top: 1px solid var(--line);
    }

    .how-step:last-child {
      border-bottom: 1px solid var(--line);
    }

    .step-number {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--lavender-dark);
      background: var(--lavender-soft);
      border-radius: 50%;
      font-weight: 800;
    }

    .how-step strong {
      display: block;
      margin-bottom: 0.15rem;
      color: var(--night);
    }

    .how-step span:last-child {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .setup-card {
      padding: clamp(1.35rem, 3vw, 2.25rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow-md);
    }

    .setup-heading {
      margin-bottom: 0.3rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3vw, 2.35rem);
    }

    .setup-subtitle {
      margin-bottom: 1.8rem;
      color: var(--muted);
    }

    .option-group {
      margin: 0 0 1.8rem;
      padding: 0;
      border: 0;
    }

    .option-group legend {
      width: 100%;
      margin-bottom: 0.8rem;
      color: var(--night);
      font-weight: 800;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .choice-card {
      position: relative;
      min-height: 132px;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .choice-card:hover {
      transform: translateY(-2px);
      border-color: rgba(108, 114, 217, 0.58);
      box-shadow: var(--shadow-sm);
    }

    .choice-card[aria-pressed="true"] {
      border-color: var(--lavender);
      background: var(--lavender-soft);
      box-shadow: inset 0 0 0 1px var(--lavender), var(--shadow-sm);
    }

    .choice-check {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: transparent;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .choice-card[aria-pressed="true"] .choice-check {
      color: var(--surface);
      border-color: var(--lavender-dark);
      background: var(--lavender-dark);
    }

    .choice-title {
      display: block;
      margin: 0.55rem 0 0.25rem;
      color: var(--night);
      font-weight: 800;
    }

    .choice-meta {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .level-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--lavender-dark);
      background: var(--surface);
      border-radius: 10px;
      font-weight: 900;
    }

    .theme-preview {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.25rem;
      font-size: 1.38rem;
      line-height: 1;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }

    .switch-copy strong {
      display: block;
      margin-bottom: 0.2rem;
      color: var(--night);
    }

    .switch-copy span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 54px;
      height: 30px;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #cfd5e1;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 3px 8px rgba(32, 42, 68, 0.2);
      transition: transform 160ms ease;
    }

    .switch input:checked + .switch-track {
      border-color: var(--lavender);
      background: var(--lavender);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(24px);
    }

    .switch input:focus-visible + .switch-track {
      outline: 3px solid rgba(108, 114, 217, 0.38);
      outline-offset: 3px;
    }

    .start-button,
    .primary-button,
    .secondary-button,
    .text-button {
      border: 0;
      cursor: pointer;
      font-weight: 800;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease, color 160ms ease;
    }

    .start-button,
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      min-height: 52px;
      padding: 0.85rem 1.25rem;
      color: var(--surface);
      border-radius: 14px;
      background: var(--night);
      box-shadow: 0 12px 26px rgba(32, 42, 68, 0.18);
    }

    .start-button {
      width: 100%;
      margin-top: 1.35rem;
    }

    .start-button:hover,
    .primary-button:hover {
      transform: translateY(-2px);
      background: var(--lavender-dark);
      box-shadow: 0 16px 30px rgba(79, 86, 183, 0.22);
    }

    .secondary-button {
      min-height: 48px;
      padding: 0.75rem 1.1rem;
      color: var(--night);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
    }

    .secondary-button:hover {
      border-color: var(--lavender);
      color: var(--lavender-dark);
      background: var(--lavender-soft);
    }

    .text-button {
      min-height: 44px;
      padding: 0.65rem 0.8rem;
      color: var(--muted);
      border-radius: 10px;
      background: transparent;
    }

    .text-button:hover {
      color: var(--night);
      background: var(--lavender-soft);
    }

    .game-panel {
      padding: clamp(1.15rem, 3vw, 2.1rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow-md);
    }

    .game-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .game-title-wrap h1 {
      margin-bottom: 0.15rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
    }

    .game-title-wrap p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(190px, 1.35fr);
      gap: 0.7rem;
      margin-bottom: 0.9rem;
    }

    .stat-card,
    .progress-card {
      min-height: 78px;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .stat-label,
    .progress-label {
      display: block;
      margin-bottom: 0.2rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--night);
      font-size: 1.35rem;
      font-weight: 800;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .progress-value {
      color: var(--night);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e3e6ef;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--lavender), var(--success));
      transition: width 280ms ease;
    }

    .feedback {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      color: var(--night);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--lavender-soft);
      font-weight: 700;
    }

    .feedback-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--surface);
    }

    .feedback.is-success {
      border-color: rgba(47, 143, 126, 0.35);
      background: var(--success-soft);
    }

    .feedback.is-warning {
      border-color: rgba(183, 125, 8, 0.3);
      background: var(--gold-soft);
    }

    .feedback.is-danger {
      border-color: rgba(184, 76, 92, 0.28);
      background: var(--danger-soft);
    }

    .memory-grid {
      --grid-columns: 4;
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr));
      gap: clamp(0.55rem, 1.6vw, 0.95rem);
      width: min(760px, 100%);
      margin: 0 auto;
      perspective: 1200px;
    }

    .memory-card {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      border-radius: clamp(12px, 2vw, 18px);
      background: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .memory-card:disabled {
      cursor: default;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 420ms cubic-bezier(0.2, 0.75, 0.25, 1);
    }

    .memory-card.is-flipped .card-inner,
    .memory-card.is-matched .card-inner,
    .memory-card.is-preview .card-inner {
      transform: rotateY(180deg);
    }

    .card-face,
    .card-back,
    .card-front {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      color: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 72%, rgba(255, 255, 255, 0.13) 0 2px, transparent 3px),
        linear-gradient(145deg, var(--night-2), var(--night));
      background-size: 28px 28px, 34px 34px, auto;
      box-shadow: 0 12px 25px rgba(32, 42, 68, 0.16);
    }

    .back-symbol,
    .card-pattern {
      width: 42%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 5vw, 2.6rem);
      font-weight: 700;
    }

    .card-front {
      transform: rotateY(180deg);
      color: var(--night);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .card-emoji,
    .card-symbol {
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: 1;
      filter: drop-shadow(0 5px 9px rgba(32, 42, 68, 0.09));
    }

    .card-label {
      margin-top: 0.55rem;
      padding: 0 0.35rem;
      color: var(--muted);
      font-size: clamp(0.62rem, 1.5vw, 0.82rem);
      font-weight: 700;
      text-align: center;
    }

    .match-badge {
      position: absolute;
      top: 0.48rem;
      right: 0.48rem;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--surface);
      border-radius: 50%;
      background: var(--success);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .memory-card.is-matched .card-front {
      border: 2px solid var(--success);
      background: var(--success-soft);
    }

    .memory-card.is-matched .match-badge {
      opacity: 1;
      transform: scale(1);
    }

    .memory-card.is-mismatch {
      animation: card-shake 300ms ease;
    }

    @keyframes card-shake {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-5px); }
      70% { transform: translateX(5px); }
    }

    .game-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .result-card {
      position: relative;
      overflow: hidden;
      max-width: 780px;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3.8rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: -130px;
      right: -100px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(108, 114, 217, 0.1);
    }

    .result-icon {
      position: relative;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      margin: 0 auto 1.1rem;
      border-radius: 24px;
      background: var(--gold-soft);
      font-size: 2.6rem;
    }

    .result-title {
      position: relative;
      margin-bottom: 0.6rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: clamp(2.3rem, 6vw, 4rem);
      line-height: 1;
    }

    .result-message {
      position: relative;
      max-width: 560px;
      margin: 0 auto 1.5rem;
      color: var(--muted);
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 1.5rem;
      color: #d7dce8;
      font-size: 1.8rem;
    }

    .stars .is-earned {
      color: #e1a61e;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .result-stat {
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .result-stat span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result-stat strong {
      display: block;
      margin-top: 0.3rem;
      color: var(--night);
      font-size: 1.35rem;
    }

    .best-result {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 auto 1.6rem;
      padding: 0.65rem 0.9rem;
      color: var(--gold);
      border: 1px solid rgba(183, 125, 8, 0.22);
      border-radius: 999px;
      background: var(--gold-soft);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .footer-shell {
      width: min(1180px, calc(100% - 2rem));
      min-height: 78px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .footer-shell a {
      color: var(--night);
      font-weight: 700;
      text-decoration: none;
    }

    .footer-shell a:hover {
      color: var(--lavender-dark);
    }

    dialog {
      width: min(440px, calc(100% - 2rem));
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    dialog::backdrop {
      background: rgba(20, 26, 45, 0.58);
      backdrop-filter: blur(4px);
    }

    .dialog-content {
      padding: 1.5rem;
    }

    .dialog-content h2 {
      margin-bottom: 0.5rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: 1.8rem;
    }

    .dialog-content p {
      color: var(--muted);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
      margin-top: 1.3rem;
    }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 100;
      max-width: min(360px, calc(100% - 2rem));
      padding: 0.85rem 1rem;
      color: var(--surface);
      border-radius: 13px;
      background: var(--night);
      box-shadow: var(--shadow-md);
      font-weight: 700;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .setup-layout {
        grid-template-columns: 1fr;
      }

      .intro-block {
        position: static;
        padding-bottom: 0;
      }

      .intro-title {
        font-size: clamp(3.4rem, 13vw, 6rem);
      }

      .stats-bar {
        grid-template-columns: repeat(3, 1fr);
      }

      .progress-card {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 700px) {
      .nav-shell {
        min-height: 64px;
      }

      .brand-name,
      .portfolio-link span {
        display: none;
      }

      main {
        width: min(100% - 1rem, 1180px);
        padding-top: 1.2rem;
      }

      .setup-card,
      .game-panel,
      .result-card {
        border-radius: 22px;
      }

      .choice-grid {
        grid-template-columns: 1fr;
      }

      .choice-card {
        min-height: 102px;
      }

      .stats-bar {
        grid-template-columns: repeat(3, 1fr);
        gap: 0.45rem;
      }

      .stat-card,
      .progress-card {
        min-height: 68px;
        padding: 0.7rem;
      }

      .stat-label,
      .progress-label {
        font-size: 0.63rem;
      }

      .stat-value {
        font-size: 1.05rem;
      }

      .memory-grid {
        gap: 0.45rem;
      }

      .card-label {
        display: none;
      }

      .game-topline {
        align-items: center;
      }

      .game-title-wrap p {
        display: none;
      }

      .result-stats {
        grid-template-columns: 1fr;
      }

      .footer-shell {
        min-height: 92px;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
    }

    @media (max-width: 430px) {
      .language-button {
        min-width: 38px;
      }

      .setup-card,
      .game-panel {
        padding: 1rem;
      }

      .intro-title {
        font-size: 3.4rem;
      }

      .feedback {
        font-size: 0.86rem;
      }

      .card-emoji {
        font-size: 2rem;
      }

      .match-badge {
        width: 22px;
        height: 22px;
        font-size: 0.7rem;
      }
    }


    /* Enhanced first-screen experience */
    #setup-screen {
      position: relative;
      isolation: isolate;
    }

    #setup-screen::before,
    #setup-screen::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid rgba(108, 114, 217, 0.13);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.24);
      transform: rotate(10deg);
      pointer-events: none;
    }

    #setup-screen::before {
      width: 130px;
      height: 172px;
      top: 4%;
      left: -7%;
    }

    #setup-screen::after {
      width: 96px;
      height: 128px;
      right: -4%;
      bottom: 4%;
      transform: rotate(-12deg);
    }

    .setup-layout {
      grid-template-columns: minmax(0, 0.94fr) minmax(540px, 1.06fr);
      gap: clamp(2.2rem, 5vw, 5rem);
      align-items: center;
    }

    .intro-block {
      position: sticky;
      top: 104px;
      padding: 0;
    }

    .intro-title {
      margin-bottom: 0.35rem;
      font-size: clamp(3.7rem, 7.2vw, 6.5rem);
    }

    .hero-heading {
      max-width: 600px;
      margin-bottom: 0.85rem;
      color: var(--night);
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 3vw, 2.55rem);
      line-height: 1.08;
      letter-spacing: -0.025em;
    }

    .intro-tagline {
      max-width: 560px;
      margin-bottom: 1.55rem;
      font-size: clamp(1rem, 1.8vw, 1.15rem);
    }

    .game-preview {
      position: relative;
      max-width: 510px;
      min-height: 290px;
      margin: 0 0 1.35rem;
      padding: 1.2rem;
      overflow: hidden;
      border: 1px solid rgba(108, 114, 217, 0.2);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(233, 234, 251, 0.96), rgba(221, 243, 237, 0.74));
      box-shadow: 0 22px 55px rgba(32, 42, 68, 0.12);
    }

    .preview-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.75;
    }

    .preview-glow-one {
      width: 170px;
      height: 170px;
      top: -65px;
      right: -45px;
      background: rgba(108, 114, 217, 0.2);
    }

    .preview-glow-two {
      width: 120px;
      height: 120px;
      bottom: -44px;
      left: -38px;
      background: rgba(47, 143, 126, 0.18);
    }

    .preview-board {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
      max-width: 375px;
      margin: 0 auto 1rem;
      transform: rotate(-1.5deg);
    }

    .preview-card {
      position: relative;
      aspect-ratio: 0.82;
      display: grid;
      place-items: center;
      border-radius: 17px;
      box-shadow: 0 10px 23px rgba(32, 42, 68, 0.13);
      font-size: clamp(1.55rem, 3.5vw, 2.1rem);
      font-weight: 900;
    }

    .preview-card.is-open {
      color: var(--night);
      border: 2px solid rgba(47, 143, 126, 0.36);
      background: rgba(255, 255, 255, 0.95);
    }

    .preview-card.is-hidden {
      color: rgba(255, 255, 255, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.22);
      background:
        radial-gradient(circle at 28% 25%, rgba(255, 255, 255, 0.16) 0 3px, transparent 4px),
        linear-gradient(145deg, var(--night), var(--night-2));
      background-size: 22px 22px, auto;
      font-family: var(--font-display);
    }

    .preview-card i {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 50%;
      background: var(--success);
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-style: normal;
    }

    .preview-progress {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      max-width: 375px;
      margin: 0 auto;
      padding: 0.75rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.82rem;
      backdrop-filter: blur(10px);
    }

    .preview-progress strong {
      color: var(--night);
    }

    .how-to-play {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
      max-width: 510px;
    }

    .how-step {
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 0.55rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.58);
    }

    .how-step:last-child {
      border-bottom: 1px solid var(--line);
    }

    .step-number {
      width: 32px;
      height: 32px;
      font-size: 0.78rem;
    }

    .how-step strong {
      margin: 0;
      font-size: 0.84rem;
    }

    .how-step span:last-child {
      font-size: 0.72rem;
      line-height: 1.25;
    }

    .setup-card {
      padding: clamp(1.4rem, 3vw, 2.35rem);
      border-color: rgba(220, 225, 236, 0.94);
      background: rgba(255, 255, 255, 0.96);
    }

    .setup-card-heading {
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .setup-kicker {
      display: inline-flex;
      margin-bottom: 0.55rem;
      padding: 0.35rem 0.65rem;
      color: var(--lavender-dark);
      border-radius: 999px;
      background: var(--lavender-soft);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .setup-heading {
      margin-bottom: 0.2rem;
    }

    .setup-subtitle {
      margin-bottom: 0;
    }

    .option-group {
      margin-bottom: 1.55rem;
    }

    .option-group legend {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .option-group legend small {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .choice-card {
      min-height: 145px;
      padding: 1rem 0.9rem 0.9rem;
      overflow: hidden;
    }

    .choice-card[aria-pressed="true"] {
      border-color: var(--lavender-dark);
      background: linear-gradient(180deg, #f7f7ff, var(--lavender-soft));
      box-shadow: inset 0 0 0 1px var(--lavender-dark), 0 12px 25px rgba(79, 86, 183, 0.12);
    }

    .selected-label {
      position: absolute;
      top: 0.66rem;
      left: 0.66rem;
      padding: 0.25rem 0.45rem;
      color: var(--lavender-dark);
      border-radius: 999px;
      background: #fff;
      font-size: 0.57rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .choice-card[aria-pressed="true"] .selected-label {
      opacity: 1;
      transform: translateY(0);
    }

    .choice-check {
      top: 0.65rem;
      right: 0.65rem;
    }

    .mini-grid {
      width: 58px;
      min-height: 43px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin-top: 1.4rem;
      padding: 6px;
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .mini-grid i {
      aspect-ratio: 0.82;
      border: 1px solid rgba(108, 114, 217, 0.25);
      border-radius: 2px;
      background: rgba(108, 114, 217, 0.14);
    }

    .choice-card[aria-pressed="true"] .mini-grid i {
      border-color: rgba(79, 86, 183, 0.45);
      background: rgba(79, 86, 183, 0.24);
    }

    .theme-art {
      display: flex;
      gap: 0.35rem;
      margin-top: 1.35rem;
    }

    .theme-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .theme-icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nature-art { color: var(--success); }
    .space-art { color: var(--lavender-dark); }
    .science-art { color: var(--gold); }

    .choice-title {
      margin-top: 0.65rem;
    }

    .choice-meta {
      font-size: 0.72rem;
    }

    .game-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.15rem;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(108, 114, 217, 0.22);
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(233, 234, 251, 0.76), rgba(221, 243, 237, 0.56));
    }

    .summary-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .game-summary strong {
      color: var(--night);
      font-size: 0.82rem;
      text-align: right;
    }

    .start-button {
      min-height: 58px;
      margin-top: 0.9rem;
      background: linear-gradient(135deg, var(--night), var(--lavender-dark));
    }

    @media (max-width: 1060px) {
      .setup-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .intro-block {
        position: static;
        max-width: 780px;
        margin: 0 auto;
      }

      .game-preview,
      .how-to-play {
        max-width: 100%;
      }

      .preview-board,
      .preview-progress {
        max-width: 430px;
      }
    }

    @media (max-width: 700px) {
      .hero-heading {
        font-size: 1.8rem;
      }

      .game-preview {
        min-height: auto;
        padding: 0.9rem;
        border-radius: 22px;
      }

      .preview-board {
        gap: 0.45rem;
      }

      .preview-card {
        border-radius: 13px;
      }

      .how-to-play {
        grid-template-columns: 1fr;
      }

      .how-step {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .how-step span:last-child {
        font-size: 0.78rem;
      }

      .option-group legend {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.2rem;
      }

      .choice-card {
        min-height: 124px;
      }

      .level-grid,
      .theme-grid {
        grid-template-columns: 1fr;
      }

      .game-summary {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.35rem;
      }

      .game-summary strong {
        text-align: left;
      }
    }

    @media (max-width: 430px) {
      .intro-title {
        font-size: 3.55rem;
      }

      .preview-progress {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  
/* React implementation helpers */
.brand-button { border: 0; background: transparent; padding: 0; cursor: pointer; }
.memory-grid.grid-relax { grid-template-columns: repeat(4, minmax(88px, 1fr)); max-width: 760px; }
.memory-grid.grid-challenge { grid-template-columns: repeat(4, minmax(82px, 1fr)); max-width: 820px; }
.memory-grid.grid-expert { grid-template-columns: repeat(4, minmax(76px, 1fr)); max-width: 840px; }
.stars .is-earned { color: var(--gold); transform: translateY(-2px); }
.modal-backdrop { position: fixed; inset: 0; z-index: 1200; display: grid; place-items: center; padding: 1rem; background: rgba(24, 31, 51, .58); backdrop-filter: blur(6px); }
.confirm-modal { width: min(470px, 100%); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-md); }
@media (max-width: 700px) {
  .memory-grid.grid-relax, .memory-grid.grid-challenge, .memory-grid.grid-expert { grid-template-columns: repeat(4, minmax(58px, 1fr)); }
}
@media (max-width: 430px) {
  .memory-grid.grid-relax, .memory-grid.grid-challenge, .memory-grid.grid-expert { gap: .55rem; }
}
