    :root {
      --cream: #f7f1e8;
      --cream-2: #fffaf3;
      --sage: #6f8f72;
      --sage-dark: #36543a;
      --coral: #d9826b;
      --coral-dark: #9e4f3e;
      --ink: #2f241d;
      --muted: #6e5a4d;
      --line: #dfd1c2;
      --shadow: 0 18px 45px rgba(47, 36, 29, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Outfit", sans-serif; color: var(--ink); background: var(--cream); line-height: 1.65; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: "Cormorant Garamond", serif; font-weight: 700; }

    .site-nav { position: sticky; top: 0; z-index: 1000; background: rgba(47, 36, 29, 0.96); border-bottom: 1px solid rgba(255,255,255,0.14); }
    .nav-inner { max-width: 1240px; min-height: 76px; margin: 0 auto; padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: 0.55rem; color: white; font-family: "Cormorant Garamond", serif; font-size: 1.85rem; font-weight: 700; }
    .brand span { color: var(--coral); }
    .nav-actions { display: flex; align-items: center; gap: 0.8rem; }

    .btn-main, .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: 999px;
      padding: 0.88rem 1.35rem;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-main { color: white; background: var(--coral); box-shadow: 0 10px 22px rgba(217,130,107,0.24); }
    .btn-main:hover { color: white; background: var(--coral-dark); transform: translateY(-2px); }
    .btn-ghost { border: 1px solid rgba(255,255,255,0.45); color: white; }
    .btn-ghost:hover { color: var(--ink); background: white; }

    .lang-switcher { display: inline-flex; overflow: hidden; border: 1px solid rgba(255,255,255,0.45); border-radius: 999px; }
    .lang-btn { border: 0; padding: 0.42rem 0.66rem; color: #e8d8c8; background: transparent; font-size: 0.72rem; font-weight: 800; cursor: pointer; }
    .lang-btn.active { color: white; background: var(--coral); }

    .detail-hero { padding: 4.8rem 0 3.5rem; background: linear-gradient(135deg, var(--cream-2), var(--cream)); border-bottom: 1px solid var(--line); }
    .eyebrow { display: inline-flex; align-items: center; gap: 0.65rem; margin-bottom: 1rem; color: var(--sage-dark); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; }
    .eyebrow::before { content: ""; width: 42px; height: 2px; background: var(--coral); }
    .detail-hero h1 { max-width: 900px; margin: 0 0 1rem; font-size: clamp(3.8rem, 7vw, 6.5rem); line-height: 0.9; letter-spacing: -0.04em; }
    .detail-hero p { max-width: 720px; margin: 0; color: var(--muted); font-size: 1.18rem; }

    .detail-section { padding: 5rem 0; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(380px, .95fr); gap: 2.5rem; align-items: start; }
    .detail-image { width: 100%; height: 500px; object-fit: cover; border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
    .info-card, .booking-card { border: 1px solid var(--line); border-radius: 26px; background: white; box-shadow: 0 14px 30px rgba(47,36,29,0.08); }
    .info-card { margin-top: 1.5rem; padding: 2rem; }
    .info-card h2 { margin-bottom: 1.2rem; font-size: 3rem; line-height: 1; }
    .info-card h3 { margin-top: 2rem; font-size: 2rem; }
    .info-card p { color: var(--muted); font-size: 1.05rem; }
    .info-card ul { padding-left: 1.25rem; color: var(--muted); }
    .info-card li { margin-bottom: 0.45rem; }

    .booking-card { position: sticky; top: 100px; padding: 1.7rem; }
    .booking-card h2 { margin-bottom: .45rem; font-size: 2.7rem; line-height: 1; }
    .booking-intro { margin-bottom: 1.15rem; color: var(--muted); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0 1.2rem; }
    .tag { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.42rem 0.7rem; border-radius: 999px; color: var(--sage-dark); background: #edf3ec; font-size: 0.82rem; font-weight: 700; }
    .price { margin: .35rem 0 1rem; color: var(--coral-dark); font-family: "Cormorant Garamond", serif; font-size: 3rem; font-weight: 700; line-height: 1; }

    .form-label { margin-bottom: .38rem; color: var(--ink); font-size: .9rem; font-weight: 800; }
    .form-control, .form-select { min-height: 48px; border: 1px solid var(--line); border-radius: 14px; padding: .72rem .85rem; background-color: var(--cream-2); }
    .form-control:focus, .form-select:focus { border-color: var(--sage); box-shadow: 0 0 0 .2rem rgba(111,143,114,.16); background-color: white; }
    textarea.form-control { min-height: 92px; resize: vertical; }
    .booking-card .btn-main { width: 100%; border: 0; margin-top: .35rem; cursor: pointer; }

    .booking-summary { margin: 1.15rem 0; padding: 1rem; border-radius: 18px; color: white; background: var(--sage-dark); }
    .booking-summary h3 { margin: 0 0 .55rem; color: white; font-size: 1.45rem; }
    .summary-row { display: flex; justify-content: space-between; gap: 1rem; padding: .42rem 0; border-bottom: 1px solid rgba(255,255,255,.14); font-size: .92rem; }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row span { color: #dce8dc; }
    .summary-row strong { text-align: right; }

    .confirmation { margin-top: 1rem; padding: 1rem; border: 1px solid rgba(111,143,114,.35); border-radius: 18px; color: var(--sage-dark); background: #eef7ef; }
    .confirmation strong { display: block; margin-bottom: .25rem; }
    .privacy-note { margin: .8rem 0 0; color: var(--muted); font-size: .82rem; }

    .footer { padding: 2rem 0; color: #cdbdaf; background: var(--ink); }
    .footer a { color: white; }

    @media (max-width: 992px) {
      .detail-grid { grid-template-columns: 1fr; }
      .booking-card { position: static; }
      .detail-image { height: 420px; }
    }

    @media (max-width: 576px) {
      .nav-inner { padding-inline: 0.9rem; }
      .brand { font-size: 1.5rem; }
      .btn-ghost { display: none; }
      .detail-hero h1 { font-size: 3.5rem; }
      .detail-image { height: 330px; }
      .info-card { padding: 1.35rem; }
    }
  </style>
</head>

          eyebrow: "First meeting",
          lead: "A complete consultation to understand your situation and define realistic goals.",
          description: "This consultation reviews your food habits, lifestyle, preferences, and current challenges. Together, we choose simple priorities adapted to daily life.",
          duration: "75 min",
          price: "$120",
          target: "Ideal for getting started",
          included: ["Food habits review", "Discussion of needs and priorities", "Realistic goals", "First personalized recommendations"],
          expect: ["A judgment-free conversation", "Concrete advice", "A simple starting plan"],
          image: serviceImages.initiale
        },
        suivi: {
          title: "Nutrition follow-up",
          eyebrow: "Adjust and progress",
          lead: "A focused appointment to review progress and adapt the plan.",
          description: "The follow-up gives you time to ask questions, identify what works, and adjust strategies that are harder to apply.",
          duration: "45 min",
          price: "$75",
          target: "To maintain progress",
          included: ["Goal review", "Challenge analysis", "Plan adjustments", "New practical strategies"],
          expect: ["A quick review", "Realistic adjustments", "A clear next goal"],
          image: serviceImages.suivi
        },
        famille: {
          title: "Family plan",
          eyebrow: "For the whole family",
          lead: "A consultation to simplify meals and create routines that work for everyone.",
          description: "We explore meal organization, preferences, schedules, and family needs to propose simple and realistic solutions.",
          duration: "90 min",
          price: "$150",
          target: "For families",
          included: ["Meal organization", "Simple menu ideas", "Child-friendly advice", "Personalized family routine"],
          expect: ["Collaborative solutions", "Less stress around meals", "Reusable ideas"],
          image: serviceImages.famille
        },
        digestion: {
          title: "Energy and digestion",
          eyebrow: "Understand your habits",
          lead: "A consultation to explore habits that influence comfort and energy.",
          description: "We review your food habits and routine to identify simple ideas that may support digestive comfort and energy levels.",
          duration: "60 min",
          price: "$95",
          target: "To understand more",
          included: ["Habit analysis", "Possible trigger review", "Improvement ideas", "Follow-up plan"],
          expect: ["Attentive listening", "Progressive changes", "Adapted recommendations"],
          image: serviceImages.digestion
        }
      }
    };

    const ui = {
      fr: {
        back: "Retour aux services",
        included: "Ce qui est inclus",
        expect: "À quoi vous attendre",
        bookingTitle: "Réserver ce service",
        bookingIntro: "Choisissez une date et une heure, puis vérifiez le résumé avant de confirmer.",
        labels: { date: "Date", time: "Heure", name: "Nom complet", email: "Courriel", phone: "Téléphone", notes: "Préférence ou question" },
        placeholders: { name: "Ex. Salma Benali", email: "nom@email.com", phone: "613-555-0000", notes: "Optionnel" },
        summary: "Résumé du rendez-vous",
        duration: "Durée",
        price: "Prix",
        service: "Service",
        confirm: "Confirmer le rendez-vous",
        confirmed: "Rendez-vous confirmé",
        thank: "Merci",
        confirmationText: "Votre demande a été enregistrée dans ce prototype.",
        privacy: "Prototype étudiant : aucune donnée n'est réellement envoyée.",
        footer: "© 2026 NutriVie · Prototype fictif"
      },
      en: {
        back: "Back to services",
        included: "What is included",
        expect: "What to expect",
        bookingTitle: "Book this service",
        bookingIntro: "Choose a date and time, then review the summary before confirming.",
        labels: { date: "Date", time: "Time", name: "Full name", email: "Email", phone: "Phone", notes: "Preference or question" },
        placeholders: { name: "Ex. Salma Benali", email: "name@email.com", phone: "613-555-0000", notes: "Optional" },
        summary: "Appointment summary",
        duration: "Duration",
        price: "Price",
        service: "Service",
        confirm: "Confirm appointment",
        confirmed: "Appointment confirmed",
        thank: "Thank you",
        confirmationText: "Your request has been saved in this prototype.",
        privacy: "Student prototype: no information is actually sent.",
        footer: "© 2026 NutriVie · Fictitious prototype"
      }
    };

    function App() {
      const params = new URLSearchParams(window.location.search);
      const serviceId = ["initiale", "suivi", "famille", "digestion"].includes(params.get("service")) ? params.get("service") : "initiale";
      const [lang, setLang] = useState(params.get("lang") === "en" ? "en" : "fr");
      const service = details[lang][serviceId];
      const t = ui[lang];

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const defaultDate = tomorrow.toISOString().split("T")[0];

      const [form, setForm] = useState({
        date: defaultDate,
        time: "10:00",
        name: "",
        email: "",
        phone: "",
        notes: ""
      });
      const [submitted, setSubmitted] = useState(false);

      useEffect(() => {
        document.documentElement.lang = lang;
        document.title = `NutriVie | ${service.title}`;
      }, [lang, service.title]);

      function updateForm(event) {
        const { name, value } = event.target;
        setForm((previous) => ({ ...previous, [name]: value }));
        setSubmitted(false);
      }

      function submitBooking(event) {
        event.preventDefault();
        setSubmitted(true);
      }

      function displayTime(value) {
        const labels = {
          "09:00": lang === "fr" ? "9 h 00" : "9:00 a.m.",
          "10:00": lang === "fr" ? "10 h 00" : "10:00 a.m.",
          "14:30": lang === "fr" ? "14 h 30" : "2:30 p.m.",
          "16:15": lang === "fr" ? "16 h 15" : "4:15 p.m."
        };
        return labels[value] || value;
      }

      return (
        <>
          <header className="site-nav">
            <div className="nav-inner">
              <a className="brand" href={`service-website.html?lang=${lang}#accueil`}>
                <i className="bi bi-flower1"></i> Nutri<span>Vie</span>
              </a>

              <div className="nav-actions">
                <a className="btn-ghost" href={`service-website.html?lang=${lang}#services`}>
                  <i className="bi bi-arrow-left"></i> {t.back}
                </a>
                <div className="lang-switcher" aria-label={lang === "fr" ? "Changer de langue" : "Change language"}>
                  <button className={`lang-btn ${lang === "fr" ? "active" : ""}`} type="button" onClick={() => setLang("fr")}>FR</button>
                  <button className={`lang-btn ${lang === "en" ? "active" : ""}`} type="button" onClick={() => setLang("en")}>EN</button>
                </div>
              </div>
            </div>
          </header>

          <main>
            <section className="detail-hero">
              <div className="container">
                <div className="eyebrow">{service.eyebrow}</div>
                <h1>{service.title}</h1>
                <p>{service.lead}</p>
              </div>
            </section>

            <section className="detail-section">
              <div className="container detail-grid">
                <div>
                  <img className="detail-image" src={service.image} alt={service.title} />

                  <article className="info-card">
                    <h2>{service.title}</h2>
                    <p>{service.description}</p>

                    <h3>{t.included}</h3>
                    <ul>{service.included.map((item) => <li key={item}>{item}</li>)}</ul>

                    <h3>{t.expect}</h3>
                    <ul>{service.expect.map((item) => <li key={item}>{item}</li>)}</ul>
                  </article>
                </div>

                <aside className="booking-card" id="reservation">
                  <h2>{t.bookingTitle}</h2>
                  <p className="booking-intro">{t.bookingIntro}</p>

                  <div className="badge-row">
                    <span className="tag"><i className="bi bi-clock"></i> {service.duration}</span>
                    <span className="tag"><i className="bi bi-person-check"></i> {service.target}</span>
                  </div>
                  <div className="price">{service.price}</div>

                  <form onSubmit={submitBooking}>
                    <div className="row g-3">
                      <div className="col-sm-6">
                        <label className="form-label" htmlFor="detail-date">{t.labels.date}</label>
                        <input className="form-control" type="date" id="detail-date" name="date" min={defaultDate} value={form.date} onChange={updateForm} required />
                      </div>

                      <div className="col-sm-6">
                        <label className="form-label" htmlFor="detail-time">{t.labels.time}</label>
                        <select className="form-select" id="detail-time" name="time" value={form.time} onChange={updateForm} required>
                          <option value="09:00">{displayTime("09:00")}</option>
                          <option value="10:00">{displayTime("10:00")}</option>
                          <option value="14:30">{displayTime("14:30")}</option>
                          <option value="16:15">{displayTime("16:15")}</option>
                        </select>
                      </div>

                      <div className="col-12">
                        <label className="form-label" htmlFor="detail-name">{t.labels.name}</label>
                        <input className="form-control" id="detail-name" name="name" value={form.name} onChange={updateForm} placeholder={t.placeholders.name} required />
                      </div>

                      <div className="col-12">
                        <label className="form-label" htmlFor="detail-email">{t.labels.email}</label>
                        <input className="form-control" type="email" id="detail-email" name="email" value={form.email} onChange={updateForm} placeholder={t.placeholders.email} required />
                      </div>

                      <div className="col-12">
                        <label className="form-label" htmlFor="detail-phone">{t.labels.phone}</label>
                        <input className="form-control" type="tel" id="detail-phone" name="phone" value={form.phone} onChange={updateForm} placeholder={t.placeholders.phone} required />
                      </div>

                      <div className="col-12">
                        <label className="form-label" htmlFor="detail-notes">{t.labels.notes}</label>
                        <textarea className="form-control" id="detail-notes" name="notes" value={form.notes} onChange={updateForm} placeholder={t.placeholders.notes}></textarea>
                      </div>
                    </div>

                    <div className="booking-summary" aria-live="polite">
                      <h3>{t.summary}</h3>
                      <div className="summary-row"><span>{t.service}</span><strong>{service.title}</strong></div>
                      <div className="summary-row"><span>{t.duration}</span><strong>{service.duration}</strong></div>
                      <div className="summary-row"><span>{t.price}</span><strong>{service.price}</strong></div>
                      <div className="summary-row"><span>{t.labels.date}</span><strong>{form.date}</strong></div>
                      <div className="summary-row"><span>{t.labels.time}</span><strong>{displayTime(form.time)}</strong></div>
                    </div>

                    <button className="btn-main" type="submit">
                      <i className="bi bi-calendar-check"></i> {t.confirm}
                    </button>
                    <p className="privacy-note"><i className="bi bi-shield-check"></i> {t.privacy}</p>
                  </form>

                  {submitted && (
                    <div className="confirmation" role="status" aria-live="polite">
                      <strong><i className="bi bi-check-circle"></i> {t.confirmed}</strong>
                      {t.thank} {form.name}. {t.confirmationText}
                    </div>
                  )}
                </aside>
              </div>
            </section>
          </main>

          <footer className="footer">
            <div className="container d-flex flex-column flex-md-row justify-content-between gap-2">
              <span>{t.footer}</span>
              <a href={`service-website.html?lang=${lang}#services`}>{t.back}</a>
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
